  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

cking){\n    if(!t.packing.length) t.packing = buildPacking();\n    t.settings.addedPacking = true;\n  }\n  t.packing.forEach(p=>{ if(!p.section) p.section = sectionOf(p.group); });\n  if(!t.settings.amountRepair){\n    const fix = (r, k)=>{\n      const est = Number(r.estimate), cur = Number(r[k]);\n      if(est && cur && cur < est/100) r[k] = est;\n    };\n    (t.hotels||[]).forEach(h=>fix(h,\"price\"));\n    (t.transport||[]).forEach(x=>{ fix(x,\"price\"); if(x.finalPrice && Number(x.finalPrice) < Number(x.estimate||0)/100) x.finalPrice = x.price; });\n    (t.activities||[]).forEach(a=>fix(a,\"price\"));\n    (t.expenses||[]).forEach(e=>fix(e,\"amount\"));\n    t.settings.amountRepair = true;\n  }\n  if(!t.settings.idsClean){\n    [\"activities\",\"hotels\",\"transport\",\"expenses\",\"packing\"].forEach(k=>{\n      (t[k]||[]).forEach(r=>{ if(r.id && String(r.id).indexOf(\":\")>=0) r.id = String(r.id).replace(/:/g,\"-\"); });\n    });\n    t.settings.idsClean = true;\n  }\n  if(!t.settings.dayLastVillage){\n    const a = t.activities.find(x=>/Disney - יום 3/.test(x.name||\"\"));\n    const seed = INITIAL_TRIP.activities.find(x=>x.id===\"a12\");\n    if(a && seed) Object.assign(a, {name:seed.name, address:seed.address, lat:seed.lat, lng:seed.lng,\n      price:null, status:\"estimated\", transport:seed.transport, notes:seed.notes});\n    t.settings.dayLastVillage = true;\n  }\n  if(!t.settings.settledFlag){\n    t.transport.forEach(x=>{ if(x.kind===\"flight\") x.settled = true; });\n    t.hotels.forEach(h=>{ if(/pergo/i.test(h.name||\"\")) h.settled = true; });\n    t.settings.settledFlag = true;\n  }\n  if(!t.settings.packingReset){\n    t.packing.forEach(p=>p.done = false);\n    t.settings.packingReset = true;\n  }\n  if(!t.settings.addedPsgText){\n    const seedPsg = INITIAL_TRIP.activities.find(a=>a.id===\"a13\");\n    const mine = t.activities.find(a=>/PSG|Parc des Princes/i.test(a.name||\"\"));\n    if(mine && !mine.freeText && seedPsg) mine.freeText = seedPsg.freeText;\n    t.settings.addedPsgText = true;\n  }\n  t.transport.forEach(x=>{\n    if(x.name && !x.from && !x.to){\n      const parts = String(x.name).replace(/^(מונית\\/ואן|מונית|ואן|הסעה|אוטובוס)\\s*/,\"\")\n        .split(/\\s*(?:→|->|-)\\s*/);\n      x.from = (parts[0]||\"\").trim(); x.to = (parts[1]||\"\").trim();\n    }\n    if(x.name) delete x.name;\n  });\n  return t;\n}\nfunction save(){\n  trip.settings.tab = tab; trip.settings.date = selDate; trip.settings.packSec = packSec;\n  try{ localStorage.setItem(KEY, JSON.stringify(trip)); }catch(e){}\n}\nfunction splitRef(v){ const i = String(v).indexOf(\":\"); return [String(v).slice(0,i), String(v).slice(i+1)]; }\nfunction uid(p){ return p+\"-\"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }\n\n/* ---------- 5. עזרי תצוגה ---------- */\nconst MONTHS = [\"בינואר\",\"בפברואר\",\"במרץ\",\"באפריל\",\"במאי\",\"ביוני\",\"ביולי\",\"באוגוסט\",\"בספטמבר\",\"באוקטובר\",\"בנובמבר\",\"בדצמבר\"];\nconst MON_S = [\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\"];\nconst STATUS = {paid:\"שולם\", known:\"צפוי\", estimated:\"משוער\"};\nconst TYPES = [\"פעילות\",\"מלון\",\"טיסה\",\"רכבת\",\"תחבורה\",\"אוכל\",\"אחר\"];\nconst KINDS = {flight:\"טיסה\", train:\"רכבת\", bus:\"אוטובוס\", taxi:\"מונית\", transfer:\"הסעה\"};\n\nfunction money(n, cur){\n  const r = Math.round((Number(n)||0)*100)/100;\n  const s = Number.isInteger(r) ? r.toLocaleString(\"en-US\")\n    : r.toLocaleString(\"en-US\",{minimumFractionDigits:2,maximumFractionDigits:2});\n  return (cur===\"ILS\" ? \"₪\" : \"€\") + s;\n}\nfunction heDate(iso){ const d=new Date(iso+\"T00:00:00\"); return d.getDate()+\" \"+MONTHS[d.getMonth()]; }\nfunction shortDate(iso){ const d=new Date(iso+\"T00:00:00\"); return d.getDate()+\" \"+MON_S[d.getMonth()]; }\nfunction esc(s){ return String(s==null?\"\":s).replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c])); }\nfunction el(html){ const d=document.createElement(\"div\"); d.innerHTML=html.trim(); return d.firstElementChild; }\nfunction mapsUrl(q){ return \"https://www.google.com/maps/search/?api=1&query=\"+encodeURIComponent(q); }\n\nfunction costHtml(price, currency, status, firm){\n  if(price===null || price===undefined || price===\"\") return '<div class=\"cost\"><span style=\"color:var(--gray2)\">מחיר להשלמה<\u002Fspan><\u002Fdiv>';\n  const p = Number(price)||0;\n  if(!p) return '<div class=\"cost\"><span>חינם<\u002Fspan><\u002Fdiv>';\n  if(status!==\"paid\" && !firm){\n    return '<div class=\"cost\"><span class=\"estchip num\">~'+esc(money(p,currency))+'<\u002Fspan>'+\n      '<span style=\"color:var(--gray2)\">משוער<\u002Fspan><\u002Fdiv>';\n  }\n  return '<div class=\"cost\"><span class=\"num\">'+esc(money(p,currency))+'<\u002Fspan><span class=\"dot\">·<\u002Fspan><span>'+\n    esc(STATUS[status]||\"\")+'<\u002Fspan>'+(status===\"paid\"?'<span class=\"check\">✓<\u002Fspan>':'')+'<\u002Fdiv>';\n}\n\n/* כל התאריכים של הטיול, מכל הרשומות */\nfunction allDates(){\n  const set = {};\n  trip.activities.forEach(a=>a.date && (set[a.date]=1));\n  trip.transport.forEach(t=>t.date && (set[t.date]=1));\n  trip.hotels.forEach(h=>{ if(h.checkIn) set[h.checkIn]=1; if(h.checkOut) set[h.checkOut]=1; });\n  trip.expenses.forEach(e=>e.date && (set[e.date]=1));\n  return Object.keys(set).sort();\n}\nfunction defaultDate(){\n  const ds = allDates(); if(!ds.length) return \"\";\n  const today = new Date().toISOString().slice(0,10);\n  return ds.includes(today) ? today : (ds.find(d=>d>=today) || ds[0]);\n}\n\n/* פריטי הלו״ז של יום: פעילויות + תחבורה + צ׳ק-אין/אאוט */\nfunction dayItems(date){\n  const out = [];\n  trip.activities.filter(a=>a.date===date).forEach(a=>out.push({kind:\"activity\", rec:a, time:a.time,\n    name:a.name, address:a.address, lat:a.lat, lng:a.lng, price:a.price, currency:a.currency, status:a.status}));\n  trip.transport.filter(t=>t.date===date).forEach(t=>out.push({kind:\"transport\", rec:t, time:t.time,\n    name:(t.kind===\"flight\" ? (t.operator?t.operator+\" \":\"\")+(t.number||\"\") : KINDS[t.kind]||\"נסיעה\")+\n      (t.from||t.to ? \"  \"+(t.from||\"\")+\" → \"+(t.to||\"\") : (t.name ? \"  \"+t.name : \"\")),\n    address:\"\", price:t.price, currency:t.currency, status:t.status,\n    detail:(t.kind===\"flight\" ? \"המראה \"+(t.time||\"\")+\" · נחיתה \"+(t.arriveTime||\"\") : \"\")}));\n  trip.hotels.forEach(h=>{\n    if(h.checkIn===date) out.push({kind:\"hotel\", rec:h, time:h.checkInTime||\"\", name:\"צ׳ק-אין \"+h.name,\n      address:h.address, lat:h.lat, lng:h.lng, price:h.price, currency:h.currency, status:h.status, event:\"in\"});\n    if(h.checkOut===date) out.push({kind:\"hotel\", rec:h, time:h.checkOutTime||\"\", name:\"צ׳ק-אאוט \"+h.name,\n      address:h.address, lat:h.lat, lng:h.lng, price:0, currency:h.currency, status:h.status, event:\"out\"});\n  });\n  out.forEach(i=>{\n    i.order = (i.kind===\"hotel\") ? i.rec[i.event===\"in\"?\"orderIn\":\"orderOut\"] : i.rec.order;\n  });\n  const key = i => (String(i.time||\"\").match(/^\\d{1,2}:\\d{2}$/) ? Number(i.time.replace(\":\",\"\")) : 9999);\n  out.sort((x,y)=>{ const a=key(x), b=key(y); return a===b ? String(x.name||\"\").localeCompare(String(y.name||\"\")) : a-b; });\n  let n = 0;\n  out.forEach(i=>{ i.num = ++n; if(i.lat!=null && i.lng!=null) i.pin = i.num; });\n  return out;\n}\n\n/* ---------- 6. הוצאות (איגוד ללא ספירה כפולה) ---------- */\nfunction allExpenses(){\n  const rows = [];\n  trip.activities.forEach(a=>{ if(Number(a.price)) rows.push({\n    sourceType:\"activity\", sourceId:a.id, date:a.date, description:a.name,\n    type:a.type||\"פעילות\", amount:a.price, currency:a.currency||\"EUR\", status:a.status, settled:!!a.settled, rec:a}); });\n  trip.hotels.forEach(h=>{ if(Number(h.price)) rows.push({\n    sourceType:\"hotel\", sourceId:h.id, date:h.checkIn, description:h.name+\" · \"+(h.nights||\"\")+\" לילות\",\n    type:\"מלון\", amount:h.price, currency:h.currency||\"EUR\", status:h.status, settled:!!h.settled, rec:h}); });\n  trip.transport.forEach(t=>{ if(Number(t.price)) rows.push({\n    sourceType:\"transport\", sourceId:t.id, date:t.date,\n    description:(t.kind===\"flight\" ? (t.operator||\"\")+\" \"+(t.number||\"\") : KINDS[t.kind]||\"נסיעה\")+\n      (t.from||t.to ? \" · \"+(t.from||\"\")+\" → \"+(t.to||\"\") : (t.name ? \" · \"+t.name : \"\")),\n    type:t.kind===\"flight\"?\"טיסה\":(t.kind===\"train\"?\"רכבת\":\"תחבורה\"),\n    amount:t.price, currency:t.currency||\"EUR\", status:t.status, settled:!!t.settled, rec:t}); });\n  trip.expenses.forEach(e=>rows.push({\n    sourceType:\"expense\", sourceId:e.id, date:e.date, description:e.description,\n    type:e.type||\"אחר\", amount:e.amount, currency:e.currency||\"EUR\", status:e.status, settled:!!e.settled, rec:e}));\n  rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));\n  return rows;\n}\nfunction totals(rows){\n  const t = {EUR:{paid:0,known:0,estimated:0}, ILS:{paid:0,known:0,estimated:0}};\n  rows.forEach(r=>{ const c = r.currency===\"ILS\"?\"ILS\":\"EUR\"; t[c][r.status||\"estimated\"] += Number(r.amount)||0; });\n  t.EUR.total = t.EUR.paid+t.EUR.known+t.EUR.estimated;\n  t.ILS.total = t.ILS.paid+t.ILS.known+t.ILS.estimated;\n  return t;\n}\nfunction setStatus(row, status){\n  row.rec.status = status; save(); render();\n}\n\n/* ---------- 7. רינדור ---------- */\nconst TABS = [\n  {id:\"itinerary\", label:\"לו״ז\", icon:'<path d=\"M4 6h16M4 12h16M4 18h10\"/>'},\n  {id:\"expenses\",  label:\"הוצאות\", icon:'<rect x=\"3\" y=\"6\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M3 10h18M7 15h4\"/>'},\n  {id:\"hotels\",    label:\"מלונות\", icon:'<path d=\"M3 18V7M3 12h11a4 4 0 0 1 4 4v2M21 18v-4\"/><circle cx=\"7.5\" cy=\"9.5\" r=\"1.6\"/>'},\n  {id:\"transport\", label:\"תחבורה\", icon:'<path d=\"M12 3 21 9v2l-8-2v5l3 2v2l-4-1-4 1v-2l3-2V9l-8 2V9z\"/>'},\n  {id:\"packing\", label:\"ציוד\", icon:'<path d=\"M10 6h10M10 12h10M10 18h10\"/><path d=\"M4 6l1.4 1.4L8 5\"/><path d=\"M4 12l1.4 1.4L8 11\"/><path d=\"M4 18l1.4 1.4L8 17\"/>'}\n];\nTABS.push({id:\"files\", label:\"קבצים ומסמכים\",\n  icon:'<path d=\"M14 3v5h5\"/><path d=\"M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V8z\"/>'});\n\nfunction renderTabs(){\n  document.getElementById(\"navList\").innerHTML = TABS.map(t=>\n    '<button class=\"navitem'+(tab===t.id?\" on\":\"\")+'\" data-tab=\"'+t.id+'\">'+\n    '<svg viewBox=\"0 0 24 24\">'+t.icon+'<\u002Fsvg><span>'+t.label+'<\u002Fspan><\u002Fbutton>').join(\"\")+\n    '<div style=\"margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)\">'+\n    '<button class=\"navitem\" id=\"resetDefaults\">'+\n    '<svg viewBox=\"0 0 24 24\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"/><path d=\"M3 3v5h5\"/><\u002Fsvg>'+\n    '<span>איפוס ללו\"ז ברירת המחדל<\u002Fspan><\u002Fbutton><\u002Fdiv>';\n}\nfunction applyTheme(){\n  document.body.classList.add(\"t2\");\n}\nfunction openDrawer(on){\n  document.getElementById(\"drawer\").classList.toggle(\"on\", on);\n  document.getElementById(\"drawerBg\").classList.toggle(\"on\", on);\n}\n\nfunction renderHeader(){\n  const ds = allDates();\n  const d = selDate && ds.includes(selDate) ? selDate : (ds[0]||\"\");\n  const names = {itinerary:\"לו״ז\", expenses:\"הוצאות\", hotels:\"מלונות\", transport:\"תחבורה\", packing:\"ציוד\", files:\"קבצים ומסמכים\"};\n  let sub = names[tab] || \"\";\n  if(tab===\"itinerary\"){\n    sub += d ? \" · \"+heDate(d) : \" · אין עדיין תאריכים\";\n    if(trip.settings.weather) sub += \" · \" + trip.settings.weather + \" (ידני)\";\n  }\n  document.getElementById(\"headerSub\").textContent = sub;\n  const sb = document.getElementById(\"stickyBarSub\");\n  if(sb) sb.textContent = sub;\n  const hero = document.getElementById(\"hero\");\n  if(hero){\n    const want = (tab===\"itinerary\" && HERO_BY_DATE[d]) ? HERO_BY_DATE[d] : HERO_DEFAULT;\n    if(hero.getAttribute(\"src\") !== want) hero.setAttribute(\"src\", want);\n    document.body.classList.add(\"herosm\");\n    document.body.classList.add(\"herocover\");\n    hero.onerror = ()=>{ if(hero.getAttribute(\"src\")!==HERO_DEFAULT) hero.setAttribute(\"src\", HERO_DEFAULT); };\n  }\n}\n\nfunction render(){\n  renderTabs(); renderHeader();\n  const v = document.getElementById(\"view\");\n  if(tab===\"itinerary\") v.innerHTML = viewItinerary();\n  if(tab===\"expenses\"){ onExpenseScreen = true; v.innerHTML = viewExpenses(); onExpenseScreen = false; }\n  if(tab===\"hotels\")    v.innerHTML = viewHotels();\n  if(tab===\"transport\") v.innerHTML = viewTransport();\n  if(tab===\"packing\")   v.innerHTML = viewPacking();\n  if(tab===\"files\")     v.innerHTML = viewFiles();\n  v.innerHTML += backupHtml();\n  if(tab===\"itinerary\") setupMap();\n  if(tab===\"hotels\")    setupHotelMap();\n  if(tab===\"transport\") setupTransitMap();\n  save();\n}\n\n/* --- טאב לו״ז --- */\nfunction viewItinerary(){\n  const ds = allDates();\n  if(!ds.length) return '<div class=\"empty\">אין עדיין נתונים. הוסיפי פעילות, מלון או נסיעה.<\u002Fdiv>'+\n    '<button class=\"txt-btn\" data-add=\"activity\">+ הוספת פעילות<\u002Fbutton>';\n  if(!ds.includes(selDate)) selDate = ds[0];\n  const items = dayItems(selDate);\n  const eur = items.reduce((s,i)=> s + ((i.currency===\"ILS\")?0:(Number(i.price)||0)), 0);\n  const ils = items.reduce((s,i)=> s + ((i.currency===\"ILS\")?(Number(i.price)||0):0), 0);\n\n  const days = '<div class=\"days\">'+ds.map(d=>\n    '<div class=\"day'+(d===selDate?\" on\":\"\")+'\" data-date=\"'+d+'\"><span class=\"num\">'+shortDate(d)+\n    '<\u002Fspan><div class=\"bar\"><\u002Fdiv><\u002Fdiv>').join(\"\")+'<\u002Fdiv>';\n\n  const list = items.length ? '<div id=\"dayList\">'+items.map((i,idx)=>itemHtml(i,idx)).join(\"\")+'<\u002Fdiv>'\n    : '<div class=\"empty\">אין פעילויות ליום הזה<\u002Fdiv>';\n\n  const mapBlock = '<div id=\"mapSection\" style=\"margin-top:20px\">'+\n    '<div class=\"mapwrap\">'+'<div class=\"mapfold'+(mapSmall?\" folded\":\"\")+'\" data-mapfold=\"1\" title=\"'+(mapSmall?\"הגדלת המפה\":\"הקטנת המפה\")+'\">'+\n      '<svg viewBox=\"0 0 24 24\"><path d=\"M18 15l-6-6-6 6\"/><\u002Fsvg><\u002Fdiv>'+'<div id=\"map\"><\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"maplinks\">'+\n      '<span data-mapsize=\"1\" style=\"cursor:pointer;color:var(--accent);font-size:12.5px\">'+(mapBig?\"כיווץ המפה\":\"הרחבת המפה\")+'<\u002Fspan>'+\n      '<a href=\"'+LINKS.parisJeTaime+'\" target=\"_blank\" rel=\"noopener\">מפת התיירות הרשמית - Paris je t\\'aime<\u002Fa>'+\n    '<\u002Fdiv><\u002Fdiv>';\n\n  return '<div><div class=\"stickytop\">'+days+'<\u002Fdiv><div>'+\n    '<div style=\"padding:2px 2px 0\">'+\n      '<div style=\"font-size:19px;font-weight:600;letter-spacing:-.2px\">'+\n        (selDate===\"2026-10-05\" ? \"✨ יום הולדת לעידודי ✨\" : \"המסלול של היום\")+'<\u002Fdiv>'+\n      '<div class=\"tiny\" style=\"margin-top:3px\">'+items.length+' פריטים<\u002Fdiv>'+\n    '<\u002Fdiv>'+\n    '<div style=\"margin-top:10px\">'+list+'<\u002Fdiv>'+\n    '<div style=\"margin-top:10px\">'+addSlot(\"activity\",\"הוספת פעילות\")+'<\u002Fdiv>'+\n    mapBlock+'<\u002Fdiv><\u002Fdiv>';\n}\n\nconst expanded = {};\nconst MORE_FIELDS = [\n  [\"openingHours\",\"שעות פתיחה\"], [\"transport\",\"תחבורה\"], [\"notes\",\"הערות\"]\n];\nfunction hasMore(rec){\n  return MORE_FIELDS.some(f=>rec[f[0]]) || !!rec.freeText || !!rec.appUrl;\n}\nfunction moreHtml(rec){\n  if(!hasMore(rec) || !expanded[rec.id]) return \"\";\n  let out = '<div style=\"margin-top:10px;padding-top:10px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:8px\">';\n  MORE_FIELDS.forEach(f=>{\n    if(!rec[f[0]]) return;\n    out += '<div><div class=\"tiny\" style=\"color:var(--gray2)\">'+f[1]+'<\u002Fdiv>'+\n      '<div class=\"small\" style=\"white-space:pre-wrap\">'+esc(String(rec[f[0]]))+'<\u002Fdiv><\u002Fdiv>';\n  });\n  if(rec.freeText) out += '<div class=\"small\" style=\"white-space:pre-wrap\">'+esc(String(rec.freeText))+'<\u002Fdiv>';\n  if(rec.appUrl) out += '<div class=\"quick\"><a href=\"'+esc(rec.appUrl)+'\" target=\"_blank\" rel=\"noopener\">אפליקציה<\u002Fa><\u002Fdiv>';\n  return out+'<\u002Fdiv>';\n}\nfunction itemHtml(i, idx){\n  const typ = i.kind===\"activity\" ? \"activity\" : (i.kind===\"hotel\" ? \"hotel\" : \"transport\");\n  if(isInline(typ, i.rec.id)) return formCard(typ, i.rec.id);\n  const q = [];\n  const rec = i.rec;\n  if(rec.ticketUrl) q.push('<a href=\"'+esc(rec.ticketUrl)+'\" target=\"_blank\" rel=\"noopener\">כרטיסים<\u002Fa>');\n  if(rec.officialWebsite||rec.website) q.push('<a href=\"'+esc(rec.officialWebsite||rec.website)+'\" target=\"_blank\" rel=\"noopener\">אתר רשמי<\u002Fa>');\n\n  return '<div class=\"item'+(selItem===idx?\" on\":\"\")+'\" data-item=\"'+idx+'\">'+\n    '<div class=\"t num\">'+esc(i.time||\"\")+'<\u002Fdiv>'+\n    (i.pin?'<div class=\"pin num tap\" data-focus=\"'+idx+'\">'+i.num+'<\u002Fdiv>'\n         :'<div class=\"pin num nomap\">'+i.num+'<\u002Fdiv>')+\n    '<div class=\"b\">'+\n      '<div class=\"name\">'+esc(i.name)+'<\u002Fdiv>'+\n      (i.detail?'<div class=\"small num\" style=\"color:var(--accent);text-align:right\">'+esc(i.detail)+'<\u002Fdiv>':'')+\n      (i.kind!==\"activity\"?'<div><span class=\"kind\">'+(i.kind===\"hotel\"?\"מלון\":\"תחבורה\")+'<\u002Fspan><\u002Fdiv>':'')+\n      (i.address?'<div class=\"small ltr\" style=\"color:var(--gray2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right\">'+esc(i.address)+'<\u002Fdiv>':'')+\n      (rec.confirmation?'<div class=\"tiny\" style=\"margin-top:4px\">אישור <span class=\"num\">'+esc(rec.confirmation)+'<\u002Fspan><\u002Fdiv>':'')+\n      (i.event===\"out\"?'':costHtml(i.price,i.currency,i.status,\n        i.kind===\"hotel\" || (i.kind===\"transport\" && i.rec.kind===\"flight\")))+\n      (q.length?'<div class=\"quick\">'+q.join(\"\")+'<\u002Fdiv>':'')+\n      moreHtml(rec)+\n      '<div style=\"margin-top:10px;display:flex;justify-content:flex-end;gap:8px\">'+\n      (hasMore(rec)?'<span class=\"edit-item\" data-more=\"'+esc(rec.id)+'\">'+\n        (expanded[rec.id]?\"הצג פחות\":\"הצג יותר\")+'<\u002Fspan>':'')+\n      '<span class=\"edit-item\" data-edititem=\"'+idx+'\">'+\n        '<svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">'+\n          '<path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z\"/><\u002Fsvg>עריכה<\u002Fspan><\u002Fdiv>'+\n    '<\u002Fdiv><\u002Fdiv>';\n}\n\n/* --- מפה --- */\n/* מפות בסיס (נתוני OpenStreetMap). נבחר הראשון שמחזיר אריח אמיתי. */\nconst OSM_ATTR = '© <a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">OpenStreetMap<\u002Fa>';\nconst TILE_PROVIDERS = [\n  {url:\"https://tile.openstreetmap.de/{z}/{x}/{y}.png\", attr:OSM_ATTR+' · <a href=\"https://openstreetmap.de/\" target=\"_blank\" rel=\"noopener\">OSM Deutschland<\u002Fa>'},\n  {url:\"https://tile.openstreetmap.org/{z}/{x}/{y}.png\", attr:OSM_ATTR},\n  {url:\"https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png\", sub:\"abc\", attr:OSM_ATTR+' · <a href=\"https://opentopomap.org/\" target=\"_blank\" rel=\"noopener\">OpenTopoMap<\u002Fa>'}\n];\nlet chosenTiles = null;\nasync function pickTiles(){\n  if(chosenTiles) return chosenTiles;\n  for(const p of TILE_PROVIDERS){\n    const probe = p.url.replace(\"{s}\",\"a\").replace(\"{z}\",\"15\").replace(\"{x}\",\"16597\").replace(\"{y}\",\"11268\");\n    try{\n      const r = await fetch(probe, {cache:\"no-store\"});\n      if(r.ok){ const b = await r.blob(); if(b.size > 3000){ chosenTiles = p; return p; } }\n    }catch(e){}\n  }\n  chosenTiles = TILE_PROVIDERS[0];\n  return chosenTiles;\n}\nfunction addTiles(target){\n  pickTiles().then(p=>{\n    if(target !== map) return;\n    L.tileLayer(p.url, {maxZoom:19, subdomains:p.sub||\"abc\", attribution:p.attr}).addTo(target);\n  });\n}\n\nfunction setupMap(){\n  const box = document.getElementById(\"map\");\n  if(!box || !window.L) return;\n  const items = dayItems(selDate).filter(i=>i.lat!=null && i.lng!=null);\n  if(map){ map.remove(); map=null; }\n  markers = [];\n  box.classList.toggle(\"big\", mapBig && !mapSmall);\n  box.classList.toggle(\"small\", mapSmall);\n  map = L.map(box, {zoomControl:mapBig && !mapSmall, attributionControl:true});\n  addTiles(map);\n  if(!items.length){ map.setView([48.8566,2.3522],11); return; }\n  const bounds = [];\n  items.forEach(i=>{\n    const idx = dayItems(selDate).findIndex(x=>x.rec===i.rec && x.time===i.time);\n    const m = L.marker([i.lat,i.lng], {icon:L.divIcon({className:\"\", html:'<div class=\"marker num\">'+i.num+'<\u002Fdiv>', iconSize:[24,24], iconAnchor:[12,12]})}).addTo(map);\n    m.bindPopup('<div style=\"font-size:13px\"><b>'+esc(i.name)+'<\u002Fb><br><span style=\"color:#8A8279\">'+esc(i.time||\"\")+'<\u002Fspan><\u002Fdiv>');\n    m.on(\"click\", ()=>{ selItem = idx; render(); const node=document.querySelector('[data-item=\"'+idx+'\"]'); if(node) node.classList.add(\"on\"); });\n    markers.push({idx, m});\n    bounds.push([i.lat,i.lng]);\n  });\n  map.fitBounds(bounds, {padding:[34,34], maxZoom:15});\n}\nfunction setupTransitMap(){\n  const box = document.getElementById(\"transitMap\");\n  if(!box || !window.L) return;\n  if(transitMap){ transitMap.remove(); transitMap = null; }\n  box.classList.toggle(\"big\", mapBig && !mapSmall);\n  box.classList.toggle(\"small\", mapSmall);\n  transitMap = L.map(box, {zoomControl:mapBig && !mapSmall, attributionControl:true});\n  L.tileLayer(\"https://tileserver.memomaps.de/tilegen/{z}/{x}/{y}.png\", {\n    maxZoom:18, attribution:OSM_ATTR+' · <a href=\"https://memomaps.de/\" target=\"_blank\" rel=\"noopener\">ÖPNVKarte<\u002Fa>'\n  }).addTo(transitMap);\n  transitMap.setView([48.8600, 2.3400], 12);\n  trip.hotels.filter(h=>h.lat!=null).forEach((h,k)=>{\n    L.marker([h.lat,h.lng], {icon:L.divIcon({className:\"\",\n      html:'<div class=\"marker num\">'+(k+1)+'<\u002Fdiv>', iconSize:[24,24], iconAnchor:[12,12]})})\n      .addTo(transitMap).bindPopup('<div style=\"font-size:13px\"><b>'+esc(h.name)+'<\u002Fb><\u002Fdiv>');\n  });\n}\n\nfunction setupHotelMap(){\n  const box = document.getElementById(\"hotelMap\");\n  if(!box || !window.L) return;\n  const geo = trip.hotels.filter(h=>h.lat!=null && h.lng!=null);\n  if(map){ map.remove(); map=null; }\n  markers = [];\n  box.classList.toggle(\"big\", mapBig && !mapSmall);\n  box.classList.toggle(\"small\", mapSmall);\n  map = L.map(box, {zoomControl:mapBig && !mapSmall, attributionControl:true});\n  addTiles(map);\n  if(!geo.length){ map.setView([48.8566,2.3522],10); return; }\n  const bounds = [];\n  geo.forEach((h,k)=>{\n    const m = L.marker([h.lat,h.lng], {icon:L.divIcon({className:\"\",\n      html:'<div class=\"marker num\">'+(k+1)+'<\u002Fdiv>', iconSize:[24,24], iconAnchor:[12,12]})}).addTo(map);\n    m.bindPopup('<div style=\"font-size:13px\"><b>'+esc(h.name)+'<\u002Fb><br><span style=\"color:#8A8279\">'+\n      esc(shortDate(h.checkIn))+' → '+esc(shortDate(h.checkOut))+'<\u002Fspan><\u002Fdiv>');\n    markers.push({idx:k, m});\n    bounds.push([h.lat,h.lng]);\n  });\n  map.fitBounds(bounds, {padding:[40,40], maxZoom:13});\n}\n\nfunction scrollToMap(){\n  const s = document.getElementById(\"mapSection\");\n  if(!s) return;\n  const y = s.getBoundingClientRect().top + window.pageYOffset - 56;\n  window.scrollTo({top:y, behavior:\"smooth\"});\n}\nfunction focusItem(idx){\n  const i = dayItems(selDate)[idx];\n  selItem = idx; render();\n  if(!i || i.lat==null || !map) return;\n  map.setView([i.lat,i.lng], 15, {animate:true});\n  const hit = markers.find(m=>m.idx===idx); if(hit) hit.m.openPopup();\n  setTimeout(scrollToMap, 60);\n}\n\n/* --- טאב הוצאות --- */\nfunction viewExpenses(){\n  const today = new Date().toISOString().slice(0,10);\n\n  const expCard = (rec, type, key, label) => {\n    const isNew = !rec;\n    const cur = rec ? (rec.currency||\"EUR\") : \"EUR\";\n    const meth = rec ? (rec.method||\"\") : \"אשראי\";\n    const amtVal = rec ? (Number(rec[key])||\"\") : \"\";\n    const dateVal = rec ? (rec.date || rec.checkIn || today) : today;\n    const descVal = rec ? (rec.description || rec.name || label || \"\") : \"\";\n    return '<div id=\"expForm\" data-ref=\"'+(isNew?'':type+':'+esc(rec.id))+'\" data-fkey=\"'+(key||\"amount\")+'\" '+\n      'style=\"margin-top:16px;border:1px solid var(--line);border-radius:12px;background:#E9F0FA;padding:14px 14px 12px\">'+\n      '<div style=\"display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap\">'+\n        '<div style=\"flex:1;min-width:170px;display:flex;flex-direction:column;gap:8px\">'+\n          '<input data-exp=\"date\" type=\"date\" value=\"'+esc(dateVal)+'\" dir=\"ltr\" '+\n            'style=\"text-align:right;font-size:13px;color:var(--gray);background:#FFFFFF;border:1px solid var(--line);'+\n            'border-radius:8px;padding:8px 10px;width:100%\">'+\n          '<input data-exp=\"description\" value=\"'+esc(descVal)+'\" placeholder=\"על מה יצא הכסף\" '+\n            'style=\"font-size:15px;background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%\">'+\n        '<\u002Fdiv>'+\n        '<div class=\"estbox\">'+\n          '<div class=\"meth\" data-pick=\"expmethod\">'+\n            ['מזומן','אשראי'].map(m=>'<span class=\"'+(meth===m?\"on\":\"\")+'\" data-expmethod=\"'+m+'\">'+m+'<\u002Fspan>').join(\"\")+\n          '<\u002Fdiv>'+\n          '<input data-exp=\"amount\" data-cost=\"1\" inputmode=\"decimal\" value=\"'+esc(amtVal)+'\" style=\"background:#FFFFFF\">'+\n          '<div class=\"pick\" data-pick=\"expcur\" style=\"padding:0;gap:8px\">'+\n            ['EUR','ILS'].map(c=>'<span class=\"'+(cur===c?\"on\":\"\")+'\" data-expcur=\"'+c+'\" style=\"font-size:13px;border:0\">'+\n              (c===\"ILS\"?\"₪\":\"€\")+'<\u002Fspan>').join(\"\")+\n          '<\u002Fdiv>'+\n        '<\u002Fdiv>'+\n      '<\u002Fdiv>'+\n      '<div class=\"row\" style=\"gap:18px;margin-top:14px\">'+\n        '<button class=\"btn\" data-expsave=\"1\">אישור<\u002Fbutton>'+\n        '<button class=\"btn ghost\" data-expcancel=\"1\">ביטול<\u002Fbutton>'+\n        (isNew?'':'<button class=\"btn ghost\" data-expdel=\"1\" style=\"color:var(--danger)\">מחיקה<\u002Fbutton>')+\n      '<\u002Fdiv><\u002Fdiv>';\n  };\n  const rows = allExpenses(); const t = totals(rows);\n\n  const shown = rows.filter(r=>r.settled || r.status===\"paid\");\n  const paidRows = rows.filter(r=>r.status===\"paid\");\n  const byMethod = m => {\n    const sel = paidRows.filter(r=>(m===\"\" ? !r.rec.method : r.rec.method===m));\n    return {\n      eur: sel.filter(r=>r.currency!==\"ILS\").reduce((a,r)=>a+(Number(r.amount)||0),0),\n      ils: sel.filter(r=>r.currency===\"ILS\").reduce((a,r)=>a+(Number(r.amount)||0),0),\n      n: sel.length\n    };\n  };\n  const cash = byMethod(\"מזומן\"), credit = byMethod(\"אשראי\");\n  const nText = n => n===1 ? \"הוצאה אחת\" : n+\" הוצאות\";\n  const paidEur = paidRows.filter(r=>r.currency!==\"ILS\").reduce((a,r)=>a+(Number(r.amount)||0),0);\n  const paidIls = paidRows.filter(r=>r.currency===\"ILS\").reduce((a,r)=>a+(Number(r.amount)||0),0);\n  const splitTotal = cash.eur + credit.eur;\n  const cashPct = splitTotal ? cash.eur/splitTotal : 0;\n  const C = 2*Math.PI*26;\n  const donut = '<svg viewBox=\"0 0 64 64\" width=\"64\" height=\"64\" style=\"flex-shrink:0;transform:rotate(-90deg)\">'+\n      '<circle cx=\"32\" cy=\"32\" r=\"26\" fill=\"none\" stroke=\"#E5DFD6\" stroke-width=\"9\"/>'+\n      (splitTotal?'<circle cx=\"32\" cy=\"32\" r=\"26\" fill=\"none\" stroke=\"#4A8BE0\" stroke-width=\"9\" '+\n        'stroke-dasharray=\"'+(C*cashPct).toFixed(1)+' '+C.toFixed(1)+'\"/>'+\n        '<circle cx=\"32\" cy=\"32\" r=\"26\" fill=\"none\" stroke=\"#9878CB\" stroke-width=\"9\" '+\n        'stroke-dasharray=\"'+(C*(1-cashPct)).toFixed(1)+' '+C.toFixed(1)+'\" stroke-dashoffset=\"'+(-C*cashPct).toFixed(1)+'\"/>':'')+\n    '<\u002Fsvg>';\n  const legend = (label, d, color) => '<div style=\"display:flex;align-items:baseline;gap:7px\">'+\n      '<span style=\"width:8px;height:8px;border-radius:2px;background:'+color+';flex-shrink:0;transform:translateY(-1px)\"><\u002Fspan>'+\n      '<span class=\"tiny\" style=\"min-width:38px\">'+label+'<\u002Fspan>'+\n      '<span class=\"num\" style=\"font-size:13.5px;font-weight:550\">'+money(d.eur,\"EUR\")+'<\u002Fspan>'+\n      (d.ils?'<span class=\"tiny num\">· '+money(d.ils,\"ILS\")+'<\u002Fspan>':'')+'<\u002Fdiv>';\n  const dash = '<div class=\"stickywrap\"><div class=\"frame stickycard\" style=\"display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px\">'+\n      '<div>'+\n        '<div class=\"tiny\">הוצאות עד כה<\u002Fdiv>'+\n        '<div class=\"num\" style=\"font-size:26px;font-weight:600;letter-spacing:-.6px;margin-top:4px\">'+money(paidEur,\"EUR\")+'<\u002Fdiv>'+\n        (paidIls?'<div class=\"tiny num\" style=\"margin-top:3px\">'+money(paidIls,\"ILS\")+'<\u002Fdiv>':'')+\n      '<\u002Fdiv>'+\n      '<div style=\"display:flex;align-items:center;gap:14px\">'+\n        '<div style=\"display:flex;flex-direction:column;gap:7px\">'+\n          legend(\"מזומן\", cash, \"#4A8BE0\")+\n          legend(\"אשראי\", credit, \"#9878CB\")+\n        '<\u002Fdiv>'+donut+\n      '<\u002Fdiv>'+\n    '<\u002Fdiv><\u002Fdiv>';\n  const list = shown.length ? shown.map((r,i)=>\n    (editExp && editExp.type===r.sourceType && editExp.id===r.sourceId)\n    ? expCard(r.rec, r.sourceType, r.sourceType===\"expense\"?\"amount\":\"price\", r.description)\n    : '<div class=\"exp\">'+\n      '<div class=\"b\">'+\n        '<div style=\"font-size:14.5px;font-weight:550\">'+esc(r.description||\"\")+'<\u002Fdiv>'+\n        '<div class=\"tiny\" style=\"margin-top:3px\"><span class=\"num\">'+esc(r.date?shortDate(r.date):\"\")+'<\u002Fspan> · '+\n          esc(r.rec.method || r.type)+'<\u002Fdiv>'+\n\n      '<\u002Fdiv>'+\n      '<div class=\"amt\">'+costCtl(r.sourceType, r.rec, r.sourceType===\"expense\"?\"amount\":\"price\")+'<\u002Fdiv>'+\n    '<\u002Fdiv>').join(\"\") : '<div class=\"empty\">עוד לא יצאו הוצאות בפועל<\u002Fdiv>';\n\n\n  let form = '<button class=\"txt-btn\" data-expopen=\"1\" style=\"margin-top:16px\">+ הוספת הוצאה<\u002Fbutton>';\n  if(addExpOpen) form = expCard(null, \"expense\", \"amount\");\n  else if(editExp) form = \"\";\n  const sumRow = '<div class=\"between\" style=\"margin-top:16px;padding-top:12px;border-top:1px solid var(--line)\">'+\n      '<div class=\"small\">סה״כ שולם<\u002Fdiv>'+\n      '<div class=\"small num\">'+money(paidRows.filter(r=>r.currency!==\"ILS\").reduce((a,r)=>a+(Number(r.amount)||0),0),\"EUR\")+\n        '<\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"between\" style=\"margin-top:5px\"><div class=\"tiny\">מזומן<\u002Fdiv>'+\n      '<div class=\"tiny num\">'+money(cash.eur,\"EUR\")+(cash.ils?' · '+money(cash.ils,\"ILS\"):'')+'<\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"between\" style=\"margin-top:3px\"><div class=\"tiny\">אשראי<\u002Fdiv>'+\n      '<div class=\"tiny num\">'+money(credit.eur,\"EUR\")+(credit.ils?' · '+money(credit.ils,\"ILS\"):'')+'<\u002Fdiv><\u002Fdiv>';\n  return dash +\n    '<div class=\"frame\"><div class=\"tiny\" style=\"margin-bottom:10px\">הוצאות שיצאו בפועל<\u002Fdiv>' +\n    list + form + sumRow + '<\u002Fdiv>';\n}\n\n/* --- פקד עלות: סכום אפור + ✓ + מזומן/אשראי, לכל סוג רשומה --- */\nconst PENCIL = '<svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"/><\u002Fsvg>';\nfunction listOf(type){\n  return type===\"activity\"?trip.activities:(type===\"hotel\"?trip.hotels:(type===\"transport\"?trip.transport:(type===\"packing\"?trip.packing:trip.expenses)));\n}\nfunction methToggle(type, rec){\n  return '<div class=\"meth\" data-methbox=\"1\">'+['מזומן','אשראי'].map(m=>\n    '<span class=\"'+(rec.method===m?\"on\":\"\")+'\" data-rowmeth=\"'+m+'\" data-rowref=\"'+type+':'+esc(rec.id)+'\">'+m+'<\u002Fspan>').join(\"\")+'<\u002Fdiv>';\n}\nfunction parseAmount(v){\n  let t = String(v==null?\"\":v).replace(/[^0-9.,]/g,\"\");\n  if(t.indexOf(\".\")>=0 && t.indexOf(\",\")>=0) t = t.replace(/,/g,\"\");\n  else if((t.match(/,/g)||[]).length===1 && !/\\d{3}$/.test(t.split(\",\")[1]||\"\")) t = t.replace(\",\",\".\");\n  else t = t.replace(/,/g,\"\");\n  const parts = t.split(\".\");\n  if(parts.length>2) t = parts.slice(0,-1).join(\"\")+\".\"+parts[parts.length-1];\n  const n = parseFloat(t);\n  return isNaN(n) ? null : n;\n}\nfunction costCtl(type, rec, key){\n  const cur = rec.currency||\"EUR\";\n  const amt = Number(rec[key])||0;\n  const editing = !!editCost[rec.id];\n  if(rec.status===\"paid\" && !editing){\n    return '<div style=\"text-align:left\">'+\n      '<div class=\"num\" style=\"font-size:14.5px\">'+(amt?money(amt,cur):\"\")+' <span class=\"check\">✓<\u002Fspan>'+\n        '<span '+(onExpenseScreen?'data-expedit=\"'+type+':'+esc(rec.id)+'\"':'data-editcost=\"'+esc(rec.id)+'\"')+' title=\"עריכה\" style=\"display:inline-flex;vertical-align:middle;margin-inline-start:7px;cursor:pointer;color:var(--gray2)\">'+PENCIL+'<\u002Fspan>'+\n      '<\u002Fdiv>'+\n      (rec.method?'<div class=\"tiny\" style=\"margin-top:3px\">'+esc(rec.method)+'<\u002Fdiv>':'')+\n    '<\u002Fdiv>';\n  }\n  return '<div class=\"estbox\">'+methToggle(type, rec)+\n    '<button class=\"okbtn\" data-cok=\"1\" data-ctype=\"'+type+'\" data-cid=\"'+esc(rec.id)+'\" data-ckey=\"'+key+'\" title=\"אישור העלות\">✓<\u002Fbutton>'+\n    '<input data-cost=\"1\" value=\"'+esc(amt?String(amt):\"\")+'\">'+\n  '<\u002Fdiv>';\n}\n\n/* --- פאנל נפתח, עריכה במקום --- */\nconst CHEV = '<svg viewBox=\"0 0 24 24\"><path d=\"M6 9l6 6 6-6\"/><\u002Fsvg>';\nconst PANEL_FIELDS = {\n  hotel: [\n    {k:\"address\", l:\"כתובת\", ltr:true}, {k:\"confirmation\", l:\"מספר הזמנה\", ltr:true},\n    {k:\"secretCode\", l:\"קוד סודי\", ltr:true}, {k:\"phone\", l:\"טלפון\", ltr:true},\n    {k:\"checkInTime\", l:\"שעת צ׳ק-אין\", ltr:true}, {k:\"checkOutTime\", l:\"שעת צ׳ק-אאוט\", ltr:true},\n    {k:\"openingHours\", l:\"שעות צ׳ק-אין/אאוט\"}, {k:\"price\", l:\"עלות\", ltr:true},\n    {k:\"website\", l:\"אתר המלון\", ltr:true}, {k:\"bookingUrl\", l:\"קישור להזמנה\", ltr:true},\n    {k:\"notes\", l:\"הערות\", area:true}\n  ],\n  transport: [\n    {k:\"boardingTime\", l:\"שעת עלייה למטוס\", ltr:true, flightOnly:true},\n    {k:\"terminal\", l:\"טרמינל\", ltr:true, flightOnly:true},\n    {k:\"gate\", l:\"שער\", ltr:true, flightOnly:true},\n    {k:\"seats\", l:\"מושבים\", flightOnly:true},\n    {k:\"baggage\", l:\"כבודה\", flightOnly:true},\n    {k:\"operator\", l:\"מפעיל / חברה\"}, {k:\"number\", l:\"מספר טיסה / רכבת\", ltr:true},\n    {k:\"from\", l:\"מוצא\", ltr:true}, {k:\"to\", l:\"יעד\", ltr:true},\n    {k:\"date\", l:\"תאריך\", ltr:true}, {k:\"time\", l:\"שעה\", ltr:true}, {k:\"arriveTime\", l:\"שעת הגעה\", ltr:true},\n    {k:\"confirmation\", l:\"מספר הזמנה\", ltr:true},\n    {k:\"estimate\", l:\"סכום משוער\", ltr:true, locked:true},\n    {k:\"finalPrice\", l:\"סכום סופי אחרי הנסיעה\", ltr:true, hint:\"מתווסף להוצאות ברגע השמירה\"},\n    {k:\"website\", l:\"אתר רשמי\", ltr:true}, {k:\"notes\", l:\"הערות\", area:true}\n  ]\n};\nfunction isOpen(type, id){\n  const key = type+\":\"+id;\n  return openCard===key;\n}\nfunction cardToggle(type, id, label){\n  const key = type+\":\"+id, open = isOpen(type,id);\n  return '<button class=\"chev'+(open?\" open\":\"\")+'\" data-card=\"'+key+'\"><span>'+\n    esc(open?\"סגירה\":label)+'<\u002Fspan>'+CHEV+'<\u002Fbutton>';\n}\nfunction cardPanel(type, id){\n  if(!isOpen(type,id)) return \"\";\n  const rec = findRec(type, id); if(!rec) return \"\";\n  const isFlight = type===\"transport\" && rec.kind===\"flight\";\n  const rows = PANEL_FIELDS[type].filter(f=>{\n    if(f.flightOnly && !isFlight) return false;\n    if((f.k===\"estimate\"||f.k===\"finalPrice\") && isFlight) return false;\n    return true;\n  }).map(f=>{\n    let v = rec[f.k]==null ? \"\" : rec[f.k];\n    if(f.k===\"estimate\") v = (rec.estimate!=null && rec.estimate!==\"\") ? rec.estimate : (rec.status!==\"paid\" ? rec.price : \"\");\n    const style = (f.ltr?' dir=\"ltr\" style=\"text-align:right'+(f.locked?';color:var(--gray2)':'')+'\"':'');\n    const attrs = 'data-inline=\"'+f.k+'\"'+style+(f.locked?' disabled':'');\n    return '<div class=\"prow\"><div class=\"tiny\">'+esc(f.l)+\n      (f.hint?' <span style=\"color:var(--gray2)\">· '+esc(f.hint)+'<\u002Fspan>':'')+'<\u002Fdiv>'+\n      (f.area ? '<textarea '+attrs+' rows=\"3\">'+esc(v)+'<\u002Ftextarea>'\n              : '<input '+attrs+' value=\"'+esc(v)+'\">')+'<\u002Fdiv>';\n  }).join(\"\");\n  const links = [];\n  if(rec.website) links.push('<a href=\"'+esc(rec.website)+'\" target=\"_blank\" rel=\"noopener\">אתר רשמי<\u002Fa>');\n  if(rec.appUrl && rec.appUrl!==rec.website) links.push('<a href=\"'+esc(rec.appUrl)+'\" target=\"_blank\" rel=\"noopener\">אפליקציה<\u002Fa>');\n  if(rec.ticketUrl) links.push('<a href=\"'+esc(rec.ticketUrl)+'\" target=\"_blank\" rel=\"noopener\">כרטיס<\u002Fa>');\n  if(rec.bookingUrl) links.push('<a href=\"'+esc(rec.bookingUrl)+'\" target=\"_blank\" rel=\"noopener\">ההזמנה<\u002Fa>');\n  if(rec.phone) links.push('<a class=\"ltr\" href=\"tel:'+esc(rec.phone)+'\">'+esc(rec.phone)+'<\u002Fa>');\n  if(rec.address) links.push('<a href=\"'+mapsUrl(rec.address)+'\" target=\"_blank\" rel=\"noopener\">Google Maps<\u002Fa>');\n  return '<div class=\"panel\" data-panel=\"1\">'+rows+\n    (links.length?'<div class=\"quick\" style=\"margin-top:12px;gap:16px;flex-wrap:wrap\">'+links.join(\"\")+'<\u002Fdiv>':'')+\n    '<div class=\"row\" style=\"gap:20px;margin-top:14px\">'+\n      '<button class=\"btn\" data-inlinesave=\"'+type+':'+id+'\"'+(dirtyCard?'':' disabled')+'>אישור<\u002Fbutton>'+\n      '<button class=\"btn ghost\" data-del=\"'+type+':'+id+'\" style=\"color:var(--danger)\">מחיקה<\u002Fbutton>'+\n    '<\u002Fdiv><\u002Fdiv>';\n}\n\n/* --- טאב מלונות --- */\nfunction viewHotels(){\n  if(!trip.hotels.length) return '<div class=\"empty\">אין מלונות<\u002Fdiv>'+\n    '<button class=\"txt-btn\" data-add=\"hotel\">+ הוספת מלון<\u002Fbutton>';\n  const geo = trip.hotels.filter(h=>h.lat!=null && h.lng!=null);\n  const head = geo.length ? '<div class=\"mapwrap\">'+'<div class=\"mapfold'+(mapSmall?\" folded\":\"\")+'\" data-mapfold=\"1\" title=\"'+(mapSmall?\"הגדלת המפה\":\"הקטנת המפה\")+'\">'+\n      '<svg viewBox=\"0 0 24 24\"><path d=\"M18 15l-6-6-6 6\"/><\u002Fsvg><\u002Fdiv>'+'<div id=\"hotelMap\"><\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"maplinks\">'+\n      '<span data-mapsize=\"1\" style=\"cursor:pointer;color:var(--accent);font-size:12.5px\">'+(mapBig?\"כיווץ המפה\":\"הרחבת המפה\")+'<\u002Fspan>'+\n      '<span class=\"tiny\">'+geo.length+' מלונות על המפה<\u002Fspan>'+\n    '<\u002Fdiv>' : '';\n  return head + trip.hotels.map((h,i)=>{\n    return '<div class=\"frame\" style=\"margin-top:'+(i?'12px':'0')+'\">'+\n      '<div class=\"between\"><div style=\"font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:8px\">'+\n        ((h.lat!=null&&h.lng!=null)?'<span class=\"pin num tap\" data-hfocus=\"'+geo.indexOf(h)+'\">'+(geo.indexOf(h)+1)+'<\u002Fspan>':'')+\n        '<span>'+esc(h.name)+'<\u002Fspan><\u002Fdiv>'+\n        costCtl(\"hotel\", h, \"price\")+'<\u002Fdiv>'+\n      '<div class=\"small\" style=\"margin-top:6px\"><span class=\"num\">'+esc(shortDate(h.checkIn))+' '+esc(h.checkInTime||\"\")+\n        '<\u002Fspan> → <span class=\"num\">'+esc(shortDate(h.checkOut))+' '+esc(h.checkOutTime||\"\")+'<\u002Fspan>'+\n        (h.nights?' · '+h.nights+' לילות':'')+'<\u002Fdiv>'+\n      (h.address?'<div class=\"small ltr\" style=\"margin-top:4px;text-align:right;color:var(--gray2)\">'+esc(h.address)+'<\u002Fdiv>':'')+\n      (h.confirmation?'<div class=\"tiny\" style=\"margin-top:4px\">אישור <span class=\"num\">'+esc(h.confirmation)+'<\u002Fspan>'+\n        (h.secretCode?' · קוד <span class=\"num\">'+esc(h.secretCode)+'<\u002Fspan>':'')+'<\u002Fdiv>':'')+\n\n      '<div style=\"margin-top:10px\">'+cardToggle(\"hotel\", h.id, \"פרטי המלון\")+'<\u002Fdiv>'+\n      cardPanel(\"hotel\", h.id)+\n    '<\u002Fdiv>';\n  }).join(\"\") + addSlot(\"hotel\",\"הוספת מלון\");\n}\n\n/* --- טאב תחבורה --- */\nfunction viewTransport(){\n  const list = trip.transport.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));\n  const NET = [\n    {name:\"Île-de-France Mobilités\", desc:\"מסלולים, מפות הרשת, מטרו, RER, אוטובוסים\", url:LINKS.idfMobilites, app:\"אפליקציה רשמית באתר\"},\n    {name:\"RATP\", desc:\"מטרו, RER, אוטובוס, טראם - מפות קווים\", url:LINKS.ratp, app:\"אפליקציית Bonjour RATP באתר\"},\n    {name:\"Transilien\", desc:\"רכבות פרבריות באזור פריז\", url:LINKS.transilien, app:\"אפליקציה רשמית באתר\"},\n    {name:\"SNCF Connect\", desc:\"רכבות SNCF, כרטיסים ולוחות זמנים\", url:LINKS.sncfConnect, app:\"אפליקציה רשמית באתר\"}\n  ];\n  const mapBlock = '<div class=\"stickytop\">'+\n    '<div class=\"tiny\" style=\"margin-bottom:8px\">מפת רכבות ואוטובוסים - כל קווי התחבורה הציבורית<\u002Fdiv>'+\n    '<div class=\"mapwrap\">'+'<div class=\"mapfold'+(mapSmall?\" folded\":\"\")+'\" data-mapfold=\"1\" title=\"'+(mapSmall?\"הגדלת המפה\":\"הקטנת המפה\")+'\">'+\n      '<svg viewBox=\"0 0 24 24\"><path d=\"M18 15l-6-6-6 6\"/><\u002Fsvg><\u002Fdiv>'+'<div id=\"transitMap\"><\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"maplinks\">'+\n      '<span data-transitsize=\"1\" style=\"cursor:pointer;color:var(--accent);font-size:12.5px\">'+(mapBig?\"כיווץ המפה\":\"הרחבת המפה\")+'<\u002Fspan>'+\n    '<\u002Fdiv><\u002Fdiv>';\n  const shortcuts = '<div class=\"frame\" style=\"margin-top:20px\">'+\n    '<a href=\"'+LINKS.ratp+'\" target=\"_blank\" rel=\"noopener\" class=\"btn\" '+\n      'style=\"display:inline-block;text-decoration:none;margin-bottom:16px\">פתיחת Bonjour RATP<\u002Fa>'+\n    '<div class=\"tiny\" style=\"margin-bottom:10px\">מפות ואפליקציות תחבורה<\u002Fdiv>'+\n    NET.map((n,i)=>'<div style=\"padding:11px 0;'+(i<NET.length-1?'border-bottom:1px solid var(--line2)':'')+'\">'+\n      '<div class=\"between\"><div style=\"font-size:14.5px;font-weight:550\">'+esc(n.name)+'<\u002Fdiv>'+\n      '<a href=\"'+n.url+'\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12.5px\">פתיחה<\u002Fa><\u002Fdiv>'+\n      '<div class=\"tiny\" style=\"margin-top:3px\">'+esc(n.desc)+' · '+esc(n.app)+'<\u002Fdiv><\u002Fdiv>').join(\"\")+\n    '<\u002Fdiv>';\n  if(!list.length) return mapBlock+'<div class=\"frame\"><div class=\"empty\">אין נסיעות<\u002Fdiv>'+\n    '<button class=\"txt-btn\" data-add=\"transport\">+ הוספת נסיעה<\u002Fbutton><\u002Fdiv>'+shortcuts;\n  return mapBlock + '<div class=\"frame\" style=\"margin-top:14px\">' + list.map(t=>{\n    return '<div style=\"padding:14px 0;border-bottom:1px solid var(--line2)\">'+\n      '<div class=\"between\" style=\"align-items:flex-start\">'+\n        '<div style=\"font-size:15.5px;font-weight:600\">'+esc(KINDS[t.kind]||\"נסיעה\")+\n          (t.number?' <span class=\"num\">'+esc(t.number)+'<\u002Fspan>':'')+'<\u002Fdiv>'+\n        ((t.kind===\"flight\" && t.status!==\"estimated\" && !Number(t.price))\n          ? '<div class=\"num\" style=\"font-size:14.5px\"><\u002Fdiv>'\n          : costCtl(\"transport\", t, \"price\"))+\n      '<\u002Fdiv>'+\n      '<div class=\"small\" style=\"margin-top:2px\"><span class=\"num\">'+esc(shortDate(t.date))+'<\u002Fspan> · '+\n        '<span class=\"num\">'+esc(t.time||\"\")+'<\u002Fspan>'+(t.arriveTime?' → <span class=\"num\">'+esc(t.arriveTime)+'<\u002Fspan>':'')+\n        ((t.kind===\"flight\"&&t.boardingTime)?' · עלייה <span class=\"num\">'+esc(t.boardingTime)+'<\u002Fspan>':'')+'<\u002Fdiv>'+\n      ((t.from||t.to)?'<div class=\"small ltr\" style=\"margin-top:1px;text-align:right\">'+esc(t.from||\"\")+' → '+esc(t.to||\"\")+'<\u002Fdiv>':\n        (t.name?'<div class=\"small\" style=\"margin-top:1px\">'+esc(t.name)+'<\u002Fdiv>':''))+\n\n      '<div style=\"margin-top:8px\">'+cardToggle(\"transport\", t.id, \"פרטי הנסיעה\")+'<\u002Fdiv>'+\n      cardPanel(\"transport\", t.id)+\n    '<\u002Fdiv>';\n  }).join(\"\") + addSlot(\"transport\",\"הוספת נסיעה\") + '<\u002Fdiv>' + shortcuts;\n}\n\n/* --- טאב ציוד --- */\nfunction viewPacking(){\n  const list = trip.packing;\n  if(!list.length) return '<div class=\"frame\"><div class=\"empty\">הרשימה ריקה<\u002Fdiv>'+\n    '<button class=\"txt-btn\" data-add=\"packing\">+ הוספת פריט<\u002Fbutton><\u002Fdiv>';\n  const secs = PACK_SECTIONS.filter(s=>list.some(p=>p.section===s))\n    .concat([...new Set(list.map(p=>p.section))].filter(s=>PACK_SECTIONS.indexOf(s)<0));\n  if(!packSec) packSec = trip.settings.packSec || secs[0];\n  if(secs.indexOf(packSec)<0) packSec = secs[0];\n  const inSec = list.filter(p=>p.section===packSec);\n  const groups = [];\n  inSec.forEach(p=>{ let g = groups.find(x=>x.name===p.group); if(!g){ g={name:p.group, items:[]}; groups.push(g); } g.items.push(p); });\n  const done = list.filter(p=>p.done).length;\n  const secBar = '<div class=\"days\" style=\"margin-bottom:14px\">'+secs.map(sc=>{\n    const d = list.filter(p=>p.section===sc);\n    return '<div class=\"day'+(sc===packSec?\" on\":\"\")+'\" data-packsec=\"'+esc(sc)+'\">'+esc(sc)+\n      ' <span class=\"tiny num\">'+d.filter(p=>p.done).length+'/'+d.length+'<\u002Fspan><div class=\"bar\"><\u002Fdiv><\u002Fdiv>';\n  }).join(\"\")+'<\u002Fdiv>';\n  const head = '<div class=\"between\">'+\n      '<div style=\"font-size:17px;font-weight:600\">רשימת ציוד<\u002Fdiv>'+\n      '<div class=\"num\" style=\"font-size:17px;font-weight:600\">'+done+'/'+list.length+'<\u002Fdiv><\u002Fdiv>';\n  const body = groups.map(g=>{\n    const gd = g.items.filter(p=>p.done).length;\n    return '<div style=\"margin-bottom:22px\">'+\n      '<div class=\"between\" style=\"margin-bottom:6px\">'+\n        '<div style=\"font-size:13.5px;font-weight:600\">'+esc(g.name)+'<\u002Fdiv>'+\n        '<div class=\"tiny num\">'+gd+'/'+g.items.length+'<\u002Fdiv><\u002Fdiv>'+\n      g.items.map(p=>\n        '<div style=\"display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line2)\">'+\n          '<span data-check=\"'+p.id+'\" style=\"width:17px;height:17px;flex-shrink:0;border-radius:4px;cursor:pointer;'+\n            'border:1px solid '+(p.done?'var(--checked)':'var(--line)')+';background:'+(p.done?'var(--checked)':'transparent')+';'+\n            'color:#FCFAF7;font-size:11px;display:flex;align-items:center;justify-content:center\">'+(p.done?'✓':'')+'<\u002Fspan>'+\n          '<input data-name=\"'+p.id+'\" value=\"'+esc(p.name)+'\" style=\"flex:1;min-width:0;font-size:14.5px;'+\n            'background:transparent;border:0;padding:2px 0;'+(p.done?'color:var(--gray)':'')+'\">'+\n          '<span data-del=\"packing:'+p.id+'\" style=\"color:#CFC7BC;font-size:15px;cursor:pointer;padding:0 4px\">×<\u002Fspan>'+\n        '<\u002Fdiv>').join(\"\")+\n      '<button class=\"txt-btn\" data-addgroup=\"'+esc(g.name)+'\" style=\"font-size:12.5px;margin-top:10px\">+ הוספה ל'+esc(g.name)+'<\u002Fbutton>'+\n    '<\u002Fdiv>';\n  }).join(\"\");\n  return '<div style=\"padding:2px 0 14px\">'+head+'<\u002Fdiv>'+\n    '<div class=\"stickyhead\">'+secBar+'<\u002Fdiv>'+\n    '<div class=\"frame\">'+body+\n      addSlot(\"packing\",\"פריט בקטגוריה חדשה\")+'<\u002Fdiv>';\n}\n\n/* --- גיבוי --- */\nfunction backupHtml(){\n  return '<div style=\"margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:20px;align-items:center;flex-wrap:wrap\">'+\n    '<span class=\"txt-btn\" data-backup=\"export\" style=\"font-size:12.5px\">גיבוי לקובץ<\u002Fspan>'+\n    '<span class=\"txt-btn\" data-backup=\"import\" style=\"font-size:12.5px\">שחזור מקובץ<\u002Fspan>'+\n    '<span class=\"tiny\" id=\"backupNote\"><\u002Fspan>'+\n    '<input type=\"file\" id=\"fileInput\" accept=\"application/json,.json\" style=\"display:none\">'+\n  '<\u002Fdiv>';\n}\nfunction note(msg){\n  const n = document.getElementById(\"backupNote\"); if(!n) return;\n  n.textContent = msg; setTimeout(()=>{ if(n.textContent===msg) n.textContent=\"\"; }, 4000);\n}\nfunction exportBackup(){\n  const data = JSON.stringify({app:\"paris-trip\", version:2, savedAt:new Date().toISOString(), trip}, null, 2);\n  const url = URL.createObjectURL(new Blob([data],{type:\"application/json\"}));\n  const d = new Date(), p = n=>String(n).padStart(2,\"0\");\n  const a = document.createElement(\"a\");\n  a.href = url; a.download = \"paris-trip-\"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+\".json\";\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  setTimeout(()=>URL.revokeObjectURL(url),1000);\n  note(\"הגיבוי הורד\");\n}\nfunction importBackup(file){\n  const r = new FileReader();\n  r.onload = ()=>{\n    try{\n      const parsed = JSON.parse(String(r.result));\n      const t = parsed.trip || parsed;\n      if(!t || (!Array.isArray(t.activities) && !Array.isArray(t.hotels) && !Array.isArray(t.transport))) throw 0;\n      trip = normalize(t); selDate = defaultDate(); save(); render(); note(\"הנתונים שוחזרו\");\n    }catch(e){ note(\"הקובץ לא נקרא. צריך קובץ גיבוי מהאפליקציה.\"); }\n  };\n  r.readAsText(file);\n}\n\n/* ---------- 8. bottom sheet: פרטים + טפסים ---------- */\nconst sheetBg = document.getElementById(\"sheetBg\"), sheetEl = document.getElementById(\"sheet\");\nfunction closeSheet(){ sheetBg.classList.remove(\"on\"); sheetEl.innerHTML=\"\"; }\nsheetBg.addEventListener(\"click\", e=>{ if(e.target===sheetBg) closeSheet(); });\n\nfunction detRow(label, value, isLtr){\n  if(!value) return \"\";\n  return '<div class=\"detrow\"><div class=\"tiny\">'+esc(label)+'<\u002Fdiv><div style=\"font-size:13.5px'+\n    (isLtr?';direction:ltr;text-align:right':'')+'\">'+value+'<\u002Fdiv><\u002Fdiv>';\n}\nfunction openDetails(type, id){\n  const rec = findRec(type,id); if(!rec) return;\n  let title = \"פרטים\", body = \"\";\n  if(type===\"activity\"){\n    title = \"פרטי הפעילות\";\n    body = '<div style=\"display:flex;flex-direction:column;gap:6px\">'+\n      '<div class=\"small num\">'+esc(rec.time||\"\")+'<\u002Fdiv>'+\n      '<div style=\"font-size:21px;font-weight:600\">'+esc(rec.name)+'<\u002Fdiv>'+\n      costHtml(rec.price,rec.currency,rec.status)+'<\u002Fdiv><div style=\"margin-top:18px\">'+\n      detRow(\"כתובת\", esc(rec.address), true)+\n      detRow(\"שעות פתיחה\", esc(rec.openingHours))+\n      detRow(\"דרכי הגעה\", esc(rec.transport))+\n      detRow(\"הערות\", esc(rec.notes))+\n      (rec.freeText?'<div class=\"detrow\"><div class=\"tiny\">טקסט חופשי<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.65;white-space:pre-line;text-wrap:pretty\">'+esc(rec.freeText)+'<\u002Fdiv><\u002Fdiv>':\"\")+\n      detRow(\"אתר רשמי\", rec.officialWebsite?'<a class=\"ltr\" href=\"'+esc(rec.officialWebsite)+'\" target=\"_blank\" rel=\"noopener\">'+esc(rec.officialWebsite.replace(/^https?:\\/\\//,\"\"))+'<\u002Fa>':\"\", true)+\n      detRow(\"כרטיסים\", rec.ticketUrl?'<a class=\"ltr\" href=\"'+esc(rec.ticketUrl)+'\" target=\"_blank\" rel=\"noopener\">רכישת כרטיסים<\u002Fa>':\"\")+\n      detRow(\"אפליקציה\", rec.appUrl?'<a class=\"ltr\" href=\"'+esc(rec.appUrl)+'\" target=\"_blank\" rel=\"noopener\">פתיחה באפליקציה<\u002Fa>':\"\")+\n      detRow(\"מפה\", (rec.address||rec.name)?'<a href=\"'+mapsUrl(rec.address||rec.name)+'\" target=\"_blank\" rel=\"noopener\">פתיחה במפה<\u002Fa>':\"\")+\n      '<\u002Fdiv><div class=\"quick\" style=\"margin-top:20px;gap:22px\">'+\n        '<span data-edit=\"activity:'+rec.id+'\" style=\"font-size:14px\">עריכה<\u002Fspan>'+\n        '<span data-del=\"activity:'+rec.id+'\" style=\"font-size:14px;color:var(--danger)\">מחיקה<\u002Fspan><\u002Fdiv>';\n  }\n  if(type===\"hotel\"){\n    title = \"פרטי המלון\";\n    body = '<div style=\"font-size:21px;font-weight:600\">'+esc(rec.name)+'<\u002Fdiv>'+\n      '<div class=\"small num\" style=\"margin-top:6px\">'+esc(shortDate(rec.checkIn))+' '+esc(rec.checkInTime||\"\")+' → '+\n        esc(shortDate(rec.checkOut))+' '+esc(rec.checkOutTime||\"\")+'<\u002Fdiv>'+\n      '<div style=\"margin-top:16px\">'+\n      detRow(\"כתובת\", esc(rec.address), true)+\n      detRow(\"מספר הזמנה\", '<span class=\"num\">'+esc(rec.confirmation||\"\")+'<\u002Fspan>')+\n      detRow(\"קוד סודי\", rec.secretCode?'<span class=\"num\">'+esc(rec.secretCode)+'<\u002Fspan>':\"\")+\n      detRow(\"טלפון\", rec.phone?'<a class=\"ltr\" href=\"tel:'+esc(rec.phone)+'\">'+esc(rec.phone)+'<\u002Fa>':\"\")+\n      detRow(\"שעות צ׳ק-אין/אאוט\", esc(rec.openingHours))+\n      detRow(\"עלות\", money(rec.price,rec.currency)+\" · \"+(STATUS[rec.status]||\"\"))+\n      detRow(\"הערות\", esc(rec.notes))+\n      detRow(\"אתר\", rec.website?'<a class=\"ltr\" href=\"'+esc(rec.website)+'\" target=\"_blank\" rel=\"noopener\">'+esc(rec.website)+'<\u002Fa>':\"\", true)+\n      detRow(\"הזמנה\", rec.bookingUrl?'<a class=\"ltr\" href=\"'+esc(rec.bookingUrl)+'\" target=\"_blank\" rel=\"noopener\">פתיחת ההזמנה<\u002Fa>':\"\")+\n      detRow(\"מפה\", (rec.address||rec.name)?'<a href=\"'+mapsUrl(rec.address||rec.name)+'\" target=\"_blank\" rel=\"noopener\">פתיחה במפה<\u002Fa>':\"\")+\n      '<\u002Fdiv><div class=\"quick\" style=\"margin-top:20px;gap:22px\">'+\n        '<span data-edit=\"hotel:'+rec.id+'\" style=\"font-size:14px\">עריכה<\u002Fspan>'+\n        '<span data-del=\"hotel:'+rec.id+'\" style=\"font-size:14px;color:var(--danger)\">מחיקה<\u002Fspan><\u002Fdiv>';\n  }\n  if(type===\"transport\"){\n    title = \"פרטי הנסיעה\";\n    body = '<div style=\"font-size:21px;font-weight:600\">'+esc(KINDS[rec.kind]||\"נסיעה\")+\n        (rec.number?' <span class=\"num\">'+esc(rec.number)+'<\u002Fspan>':'')+'<\u002Fdiv>'+\n      '<div class=\"small num\" style=\"margin-top:6px\">'+esc(shortDate(rec.date))+' · '+esc(rec.time||\"\")+\n        (rec.arriveTime?' → '+esc(rec.arriveTime):'')+'<\u002Fdiv>'+\n      '<div style=\"margin-top:16px\">'+\n      detRow(\"מפעיל / חברה\", esc(rec.operator))+\n      detRow(\"מוצא\", esc(rec.from), true)+\n      detRow(\"יעד\", esc(rec.to), true)+\n      detRow(\"טרמינל\", esc(rec.terminal))+\n      detRow(\"מספר הזמנה\", rec.confirmation?'<span class=\"num\">'+esc(rec.confirmation)+'<\u002Fspan>':\"\")+\n      detRow(\"מחיר\", Number(rec.price)?money(rec.price,rec.currency)+\" · \"+(STATUS[rec.status]||\"\"):\"\")+\n      detRow(\"הערות\", esc(rec.notes))+\n      detRow(\"אתר / אפליקציה\", rec.website?'<a class=\"ltr\" href=\"'+esc(rec.website)+'\" target=\"_blank\" rel=\"noopener\">'+esc(rec.website.replace(/^https?:\\/\\//,\"\"))+'<\u002Fa>':\"\", true)+\n      '<\u002Fdiv><div class=\"quick\" style=\"margin-top:20px;gap:22px\">'+\n        '<span data-edit=\"transport:'+rec.id+'\" style=\"font-size:14px\">עריכה<\u002Fspan>'+\n        '<span data-del=\"transport:'+rec.id+'\" style=\"font-size:14px;color:var(--danger)\">מחיקה<\u002Fspan><\u002Fdiv>';\n  }\n  if(type===\"expense\"){\n    title = \"פרטי ההוצאה\";\n    body = '<div style=\"font-size:21px;font-weight:600\">'+esc(rec.description)+'<\u002Fdiv>'+\n      '<div style=\"margin-top:16px\">'+\n      detRow(\"תאריך\", '<span class=\"num\">'+esc(rec.date||\"\")+'<\u002Fspan>')+\n      detRow(\"סוג\", esc(rec.type))+\n      detRow(\"סכום\", money(rec.amount,rec.currency)+\" · \"+(STATUS[rec.status]||\"\"))+\n      '<\u002Fdiv><div class=\"quick\" style=\"margin-top:20px;gap:22px\">'+\n        '<span data-edit=\"expense:'+rec.id+'\" style=\"font-size:14px\">עריכה<\u002Fspan>'+\n        '<span data-del=\"expense:'+rec.id+'\" style=\"font-size:14px;color:var(--danger)\">מחיקה<\u002Fspan><\u002Fdiv>';\n  }\n  showSheet(title, body);\n}\nfunction showSheet(title, body){\n  sheetEl.innerHTML = '<div class=\"between\" style=\"margin-bottom:18px\"><h2>'+esc(title)+\n    '<
