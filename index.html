"?\"hotels\":(type===\"transport\"?\"transport\":(type===\"packing\"?\"packing\":\"expenses\")));\n  trip[name] = trip[name].filter(x=>x.id!==id);\n  closeSheet(); save(); render();\n}\n\n/* ---------- 8ב. גרירה: שינוי סדר בתוך היום והעברה ליום אחר ---------- */\nlet drag = null, lastDrop = 0;\n\nfunction writeOrder(item, val){\n  if(item.kind===\"hotel\") item.rec[item.event===\"in\"?\"orderIn\":\"orderOut\"] = val;\n  else item.rec.order = val;\n}\n\n\nfunction viewFiles(){\n  const list = trip.files || [];\n  const cards = list.map((f,i)=>\n    '<div class=\"filecard\">'+\n      (f.type && f.type.indexOf(\"image/\")===0\n        ? '<img src=\"'+f.data+'\" alt=\"'+esc(f.name)+'\" data-fileopen=\"'+i+'\">'\n        : '<div class=\"filedoc\" data-fileopen=\"'+i+'\">' + (/pdf/i.test(f.type||f.name)?\"PDF\":\"DOC\") + '<\u002Fdiv>')+\n      '<div class=\"filemeta\"><div class=\"nm\">'+esc(f.name)+'<\u002Fdiv>'+\n        '<div class=\"tiny num\">'+Math.round((f.size||0)/1024)+' KB<\u002Fdiv>'+\n        '<button class=\"rm\" data-filedel=\"'+i+'\">מחיקה<\u002Fbutton><\u002Fdiv>'+\n    '<\u002Fdiv>').join(\"\");\n  const kb = list.reduce((s,f)=>s+(f.size||0),0)/1024;\n  return '<section class=\"frame\">'+\n    '<div class=\"between\"><div class=\"h2\">קבצים ומסמכים<\u002Fdiv>'+\n      '<div class=\"tiny num\">'+list.length+' · '+(kb>1024?(kb/1024).toFixed(1)+' MB':Math.round(kb)+' KB')+'<\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"drop\" id=\"dropZone\" style=\"margin-top:14px\">גרירת קבצים לכאן או לחיצה לבחירה<br>'+\n      '<span class=\"tiny\">תמונות, PDF ומסמכים · נשמרים במכשיר<\u002Fspan><\u002Fdiv>'+\n    (list.length?'<div class=\"filegrid\">'+cards+'<\u002Fdiv>':'<div class=\"empty\">אין עדיין קבצים<\u002Fdiv>')+\n  '<\u002Fsection>';\n}\n\nfunction addFiles(fileList){\n  const files = [...fileList];\n  if(!files.length) return;\n  let left = files.length;\n  files.forEach(f=>{\n    if(f.size > 4.5*1024*1024){ note(\"הקובץ \"+f.name+\" גדול מדי (מעל 4.5MB)\"); if(--left===0) render(); return; }\n    const r = new FileReader();\n    r.onload = ()=>{\n      trip.files = trip.files || [];\n      trip.files.push({name:f.name, type:f.type, size:f.size, data:r.result, added:new Date().toISOString()});\n      if(--left===0){ save(); render(); }\n    };\n    r.onerror = ()=>{ note(\"שגיאה בקריאת \"+f.name); if(--left===0) render(); };\n    r.readAsDataURL(f);\n  });\n}\n\n/* ---------- 9. אירועים ---------- */\ndocument.addEventListener(\"click\", e=>{\n  if(document.getElementById(\"drawer\").classList.contains(\"on\") &&\n     !e.target.closest(\"#drawer,#burger,#burgerSm\")){ openDrawer(false); return; }\n  const t = e.target.closest(\"#burger,#burgerSm,#drawerX,#drawerBg,#dropZone,[data-more],[data-fileopen],[data-filedel],[data-tab],[data-date],[data-item],[data-focus],[data-add],[data-open],[data-edit],[data-del],[data-save],[data-close],[data-paid],[data-backup],[data-val],[data-mapsize],[data-inlinecancel],[data-cok],[data-card],[data-inlinesave],[data-expopen],[data-expsave],[data-expcancel],[data-expcur],[data-expmethod],[data-transitsize],[data-mapfold],[data-expedit],[data-expdel],[data-confirmcost],[data-meth],[data-editcost],[data-rowmeth],[data-check],[data-addgroup],[data-packsec],[data-hfocus],[data-actmore],[data-edititem]\");\n  if(!t) return;\n  if(t.dataset.actmore){ collect(); actMore = !actMore; render(); return; }\n  if(t.dataset.more){ e.stopPropagation(); expanded[t.dataset.more] = !expanded[t.dataset.more]; render(); return; }\n  if(t.id===\"burger\" || t.id===\"burgerSm\"){ openDrawer(true); return; }\n  if(t.id===\"drawerX\" || t.id===\"drawerBg\"){ openDrawer(false); return; }\n  if(t.id===\"resetDefaults\"){\n    if(confirm('לטעון מחדש את הלו\"ז המקורי?\\nפעילויות שהוספת או ערכת יימחקו. הוצאות, מלונות וקבצים יישמרו.')){\n      trip.activities = JSON.parse(JSON.stringify(INITIAL_TRIP.activities));\n      selItem = null; inlineOpen = null; openDrawer(false); save(); render();\n    }\n    return;\n  }\n  if(t.id===\"dropZone\"){ document.getElementById(\"filePick\").click(); return; }\n  if(t.dataset.fileopen!=null){\n    const f = (trip.files||[])[+t.dataset.fileopen];\n    if(f){ const w = window.open(); if(w) w.document.write('<title>'+esc(f.name)+'<\u002Ftitle><body style=\"margin:0;background:#111\"><img src=\"'+f.data+'\" style=\"max-width:100%;display:block;margin:auto\">'); }\n    return;\n  }\n  if(t.dataset.filedel!=null){\n    trip.files.splice(+t.dataset.filedel,1); save(); render(); return;\n  }\n  if(t.dataset.rowmeth){\n    const [ty,id] = splitRef(t.dataset.rowref);\n    const listName = ty===\"activity\"?\"activities\":(ty===\"hotel\"?\"hotels\":(ty===\"transport\"?\"transport\":\"expenses\"));\n    const rec = (trip[listName]||[]).find(x=>x.id===id);\n    if(rec){\n      rec.method = t.dataset.rowmeth; save();\n      const box = t.closest(\"[data-methbox]\");\n      if(box) box.querySelectorAll(\"span\").forEach(x=>x.classList.toggle(\"on\", x===t));\n    }\n    return;\n  }\n  if(t.dataset.meth){\n    const id = t.dataset.methid, m = t.dataset.meth;\n    const rec = trip.transport.find(x=>x.id===id);\n    if(rec){ rec.method = m; save();\n      const box = t.closest(\"[data-methbox]\");\n      if(box) box.querySelectorAll(\"span\").forEach(x=>x.classList.toggle(\"on\", x===t)); }\n    return;\n  }\n  if(t.dataset.editcost){ editCost[t.dataset.editcost] = true; render(); return; }\n  if(t.dataset.cok){\n    const rec = (listOf(t.dataset.ctype)||[]).find(x=>x.id===t.dataset.cid);\n    const key = t.dataset.ckey;\n    const input = t.closest(\".estbox\").querySelector(\"[data-cost]\");\n    if(rec){\n      const parsed = input ? parseAmount(input.value) : null;\n      const val = parsed==null ? (Number(rec[key])||0) : parsed;\n      if(rec.estimate==null || rec.estimate===\"\") rec.estimate = rec[key];\n      rec[key] = val;\n      if(t.dataset.ctype===\"transport\") rec.finalPrice = val;\n      rec.status = \"paid\"; rec.settled = true;\n      delete editCost[rec.id];\n      save(); render();\n    }\n    return;\n  }\n  if(t.dataset.confirmcost){\n    const id = t.dataset.confirmcost;\n    const rec = trip.transport.find(x=>x.id===id);\n    const input = t.parentNode.querySelector(\"[data-cost]\");\n    if(rec){\n      const parsed = input ? parseAmount(input.value) : null;\n      const val = parsed==null ? (Number(rec.price)||0) : parsed;\n      if(rec.estimate==null || rec.estimate===\"\") rec.estimate = rec.price;\n      rec.price = val; rec.finalPrice = val;\n      rec.status = \"paid\"; rec.settled = true;\n      rec.method = rec.method || \"מזומן\";\n      delete editCost[id];\n      save(); render();\n    }\n    return;\n  }\n  if(t.dataset.mapfold){ mapSmall = !mapSmall; if(mapSmall) mapBig = false; render(); return; }\n  if(t.dataset.transitsize){ mapBig = !mapBig; render(); return; }\n  if(t.dataset.expopen){ addExpOpen = true; editExp = null; render(); return; }\n  if(t.dataset.expedit){ const [ty,id]=splitRef(t.dataset.expedit); editExp={type:ty,id:id}; addExpOpen=false; render(); return; }\n  if(t.dataset.expcancel){ addExpOpen = false; editExp = null; render(); return; }\n  if(t.dataset.expdel){\n    if(editExp){\n      const name = editExp.type===\"activity\"?\"activities\":(editExp.type===\"hotel\"?\"hotels\":(editExp.type===\"transport\"?\"transport\":\"expenses\"));\n      trip[name] = trip[name].filter(x=>x.id!==editExp.id);\n      editExp = null; save(); render();\n    }\n    return;\n  }\n  if(t.dataset.expcur || t.dataset.expmethod){\n    const box = t.closest(\"[data-pick]\");\n    if(box) box.querySelectorAll(\"span\").forEach(x=>x.classList.toggle(\"on\", x===t));\n    return;\n  }\n  if(t.dataset.expsave){\n    const f = document.getElementById(\"expForm\"); if(!f) return;\n    const ref = f.dataset.ref, fkey = f.dataset.fkey || \"amount\";\n    const val = k => { const n = f.querySelector('[data-exp=\"'+k+'\"]'); return n ? n.value.trim() : \"\"; };\n    const desc = val(\"description\");\n    if(!desc) return;\n    const curNode = f.querySelector('[data-pick=\"expcur\"] .on');\n    const methodNode = f.querySelector('[data-pick=\"expmethod\"] .on');\n    const amount = parseAmount(val(\"amount\")) || 0;\n    const currency = curNode ? curNode.dataset.expcur : \"EUR\";\n    const method = methodNode ? methodNode.dataset.expmethod : \"מזומן\";\n    if(ref){\n      const [ty,id] = splitRef(ref);\n      const rec = (listOf(ty)||[]).find(x=>x.id===id);\n      if(rec){\n        rec[fkey] = amount; rec.currency = currency; rec.method = method;\n        rec.status = \"paid\"; rec.settled = true;\n        if(ty===\"expense\"){ rec.date = val(\"date\"); rec.description = desc; }\n        else { if(desc) rec.name = desc; if(ty!==\"hotel\") rec.date = val(\"date\"); }\n        if(ty===\"transport\") rec.finalPrice = amount;\n      }\n      editExp = null;\n    } else {\n      trip.expenses.push({\n        id: uid(\"e\"),\n        date: val(\"date\") || new Date().toISOString().slice(0,10),\n        description: desc, amount, currency, method,\n        status: \"paid\", settled: true, type: \"אחר\"\n      });\n    }\n    addExpOpen = false; save(); render(); return;\n  }\n  if(t.dataset.card){\n    const key = t.dataset.card;\n    openCard = (openCard===key) ? null : key;\n    dirtyCard = false; render(); return;\n  }\n  if(t.dataset.inlinesave){\n    const [ty,id] = splitRef(t.dataset.inlinesave);\n    const rec = findRec(ty,id);\n    const panel = document.querySelector(\"[data-panel]\");\n    if(rec && panel){\n      panel.querySelectorAll(\"[data-inline]\").forEach(n=>{\n        if(n.disabled) return;\n        const k = n.dataset.inline;\n        if(k===\"price\" || k===\"finalPrice\" || k===\"estimate\"){\n          const num = n.value.trim()===\"\" ? \"\" : (parseFloat(String(n.value).replace(\",\",\".\"))||0);\n          rec[k] = num;\n        } else rec[k] = n.value.trim();\n      });\n      if(ty===\"transport\" && rec.finalPrice!==\"\" && rec.finalPrice!=null){\n        if(rec.estimate==null || rec.estimate===\"\") rec.estimate = rec.price;\n        rec.price = rec.finalPrice;\n        rec.status = \"paid\"; rec.settled = true;\n      }\n      dirtyCard = false; save(); render();\n    }\n    return;\n  }\n  if(t.dataset.hfocus!=null && t.dataset.hfocus!==\"\"){\n    const h = trip.hotels.filter(x=>x.lat!=null&&x.lng!=null)[+t.dataset.hfocus];\n    if(h && map){ map.setView([h.lat,h.lng], 14, {animate:true});\n      const hit = markers.find(m=>m.idx===+t.dataset.hfocus); if(hit) hit.m.openPopup();\n    }\n    return;\n  }\n  if(t.dataset.packsec){ packSec = t.dataset.packsec; render(); return; }\n  if(t.dataset.check){\n    const p = trip.packing.find(x=>x.id===t.dataset.check);\n    if(p){ p.done = !p.done; save(); render(); }\n    return;\n  }\n  if(t.dataset.addgroup){ window.__packGroup = t.dataset.addgroup; openForm(\"packing\"); return; }\n  if(t.dataset.mapsize){ mapBig = !mapBig; render(); return; }\n  if(t.dataset.tab){ tab = t.dataset.tab; selItem=null; inlineOpen=null; openDrawer(false); window.scrollTo(0,0); render(); return; }\n  if(t.dataset.date){ selDate = t.dataset.date; selItem=null; render(); return; }\n  if(t.dataset.focus!=null && t.dataset.focus!==\"\"){ e.stopPropagation(); focusItem(+t.dataset.focus); return; }\n  if(t.dataset.inlinecancel){ inlineOpen = null; inlineLinks = []; render(); return; }\n  if(t.dataset.close){ closeSheet(); return; }\n  if(t.dataset.save){ saveDraft(); return; }\n  if(t.dataset.add){ if(t.dataset.add===\"packing\") window.__packGroup = \"\"; openForm(t.dataset.add); return; }\n  if(t.dataset.open){ const [ty,id]=splitRef(t.dataset.open); openForm(ty,id); return; }\n  if(t.dataset.edit){ const [ty,id]=splitRef(t.dataset.edit); openForm(ty,id); return; }\n  if(t.dataset.del){ const [ty,id]=splitRef(t.dataset.del); delRec(ty,id); return; }\n  if(t.dataset.paid!=null && t.dataset.paid!==\"\"){\n    setStatus(allExpenses()[+t.dataset.paid], \"paid\"); return;\n  }\n  if(t.dataset.val){\n    const pick = t.closest(\"[data-pick]\");\n    if(pick){ collect(); draft[pick.dataset.pick] = t.dataset.val;\n      pick.querySelectorAll(\"span\").forEach(s=>s.classList.toggle(\"on\", s===t)); }\n    return;\n  }\n  if(t.dataset.backup===\"export\"){ exportBackup(); return; }\n  if(t.dataset.backup===\"import\"){ document.getElementById(\"fileInput\").click(); return; }\n  if(t.dataset.edititem!=null){\n    const i = dayItems(selDate)[+t.dataset.edititem];\n    if(!i) return;\n    selItem = +t.dataset.edititem;\n    openForm(i.kind===\"activity\"?\"activity\":(i.kind===\"hotel\"?\"hotel\":\"transport\"), i.rec.id);\n    return;\n  }\n  if(t.dataset.item!=null){\n    const i = dayItems(selDate)[+t.dataset.item];\n    if(!i) return;\n    selItem = +t.dataset.item;\n    if(hasMore(i.rec)) expanded[i.rec.id] = !expanded[i.rec.id];\n    if(i.lat!=null && map){ map.setView([i.lat,i.lng], 15); const hit=markers.find(m=>m.idx===selItem); if(hit) hit.m.openPopup(); scrollToMap(); }\n    render();\n  }\n});\nfunction savePackName(node){\n  const p = trip.packing.find(x=>x.id===node.dataset.name);\n  if(!p) return;\n  const v = node.value.trim();\n  if(!v || v===p.name) { node.value = p.name; return; }\n  p.name = v; save();\n}\ndocument.addEventListener(\"blur\", e=>{\n  if(e.target.dataset && e.target.dataset.name) savePackName(e.target);\n}, true);\ndocument.addEventListener(\"keydown\", e=>{\n  if(e.key===\"Enter\" && e.target.dataset && e.target.dataset.name){ e.preventDefault(); e.target.blur(); }\n});\ndocument.addEventListener(\"input\", e=>{\n  if(e.target.dataset && e.target.dataset.cost){\n    const box = e.target.closest(\".estbox\");\n    const b = box && box.querySelector(\"[data-cok],[data-confirmcost],[data-expsave]\");\n    if(b) b.classList.add(\"hot\");\n  }\n  if(e.target.dataset && e.target.dataset.inline && !dirtyCard){\n    dirtyCard = true;\n    const b = document.querySelector(\"[data-inlinesave]\");\n    if(b) b.removeAttribute(\"disabled\");\n  }\n});\ndocument.addEventListener(\"change\", e=>{\n  if(e.target.id===\"fileInput\" && e.target.files && e.target.files[0]){\n    importBackup(e.target.files[0]); e.target.value=\"\";\n  }\n});\n\n/* הצגת פס הכותרת רק לאחר גלילה מעבר לכותרת הראשית */\n(function(){\n  const bar = document.getElementById(\"stickyBar\");\n  const head = document.querySelector(\"header\");\n  if(!bar || !head) return;\n  const onScroll = ()=>{\n    const past = head.getBoundingClientRect().bottom < 44;\n    bar.classList.toggle(\"show\", past);\n  };\n  window.addEventListener(\"scroll\", onScroll, {passive:true});\n  onScroll();\n})();\n\ndocument.getElementById(\"filePick\").addEventListener(\"change\", e=>{ addFiles(e.target.files); e.target.value=\"\"; });\ndocument.addEventListener(\"dragover\", e=>{\n  if(tab!==\"files\") return; e.preventDefault();\n  const z = document.getElementById(\"dropZone\"); if(z) z.classList.add(\"hot\");\n});\ndocument.addEventListener(\"dragleave\", ()=>{ const z=document.getElementById(\"dropZone\"); if(z) z.classList.remove(\"hot\"); });\ndocument.addEventListener(\"drop\", e=>{\n  if(tab!==\"files\") return; e.preventDefault();\n  const z = document.getElementById(\"dropZone\"); if(z) z.classList.remove(\"hot\");\n  if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);\n});\ndocument.addEventListener(\"keydown\", e=>{ if(e.key===\"Escape\") openDrawer(false); });\napplyTheme();\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
