<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Paris Trip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F6FC; --surface:#FFFFFF; --ink:#23201D; --ink2:#6E665E;
    --gray:#8A8279; --gray2:#A39A90; --line:#E2DCD3; --line2:#EBE6DE;
    --accent:#3F4A5A; --paid:#3F6B4F; --danger:#A0524E; --checked:#5B5C99;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg) !important;min-height:100%;
    overflow-x:clip;max-width:100%;overscroll-behavior-x:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:clip;
  }
  input,textarea,select,button{font-family:inherit;color:inherit;font-size:16px}
  input:focus,textarea:focus,select:focus{outline:none}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--ink);text-decoration:underline}
  ::placeholder{color:#B5ADA3}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

  .wrap{background:var(--bg);max-width:520px;margin:0 auto;padding:26px 20px calc(34px + env(safe-area-inset-bottom));}
  @media(min-width:900px){.wrap{max-width:960px}}

  h1{font-size:30px;font-weight:600;letter-spacing:-.5px;line-height:1;margin:0}
  .sub{font-size:13px;color:var(--gray);margin-top:5px;line-height:1.4}
  .hero{width:100%;height:112px;object-fit:cover;object-position:50% 40%;border-radius:11px;margin:18px 0 24px;display:block;background:#E7E1D8}

  .stickybar{position:sticky;top:0;z-index:60;background:var(--bg);display:flex;align-items:baseline;gap:10px;
    padding:10px 0 8px;border-bottom:1px solid var(--line2);margin-bottom:-1px;
    opacity:0;pointer-events:none;transition:opacity .15s ease}
  .stickybar.show{opacity:1;pointer-events:auto}
  /* חוסם אטום מעל הפס, כדי שהתוכן הנגלל לא ייראה מעליו */
  .stickybar::before{content:"";position:absolute;inset-inline:-40px;bottom:100%;height:120px;background:var(--bg);display:none}
  .stickybar.show::before{display:block}

  .sb-title{font-size:16px;font-weight:600;letter-spacing:-.2px}
  .sb-sub{font-size:12px;color:var(--gray)}
  .stickytop{position:sticky;top:38px;z-index:50;background:var(--bg);padding-top:18px}
  .stickyhead{position:sticky;top:38px;z-index:50;background:var(--bg);padding:10px 0 2px}
  .stickywrap{position:sticky;top:38px;z-index:50;background:var(--bg);padding:8px 0 16px}
  .stickycard{margin-bottom:0 !important}
  .hr{height:1px;background:var(--line);margin:24px 0 18px}
  .hr-soft{height:1px;background:var(--line2)}

  .money-big{font-size:38px;font-weight:600;letter-spacing:-1.2px;line-height:1;text-align:right}
  .label{font-size:13px;color:var(--gray)}
  .small{font-size:12.5px;color:var(--gray)}
  .tiny{font-size:11.5px;color:var(--gray2)}
  .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .between{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

  .days{display:flex;gap:20px;overflow-x:auto;padding-bottom:2px;margin-bottom:22px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex-shrink:0;cursor:pointer;font-size:14px;color:var(--gray2);padding:0 0 6px;font-variant-numeric:tabular-nums;
       background:transparent !important;border:0 !important;border-radius:0 !important;box-shadow:none !important}
  .day .bar{height:1.5px;margin-top:6px;border-radius:2px;background:transparent}
  .day.on{color:var(--ink);font-weight:600}
  .day.on .bar{background:var(--accent)}

  .frame{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px}
  #map{height:28vh;max-height:230px;border-radius:11px;overflow:hidden;margin-bottom:10px;background:#E7E1D8;z-index:0;transition:height .18s ease}
  #map.big{height:68vh;max-height:none}
  #map.small{height:14vh;max-height:115px}
  #transitMap.small{height:15vh;max-height:125px}
  #hotelMap.small{height:14vh;max-height:115px}
  .mapwrap{position:relative}
  .mapfold{position:absolute;top:8px;left:8px;z-index:400;width:28px;height:28px;border-radius:8px;
    background:rgba(255,255,255,.92);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .mapfold svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
  .mapfold.folded svg{transform:rotate(180deg)}
  #transitMap{height:30vh;max-height:250px;border-radius:11px;overflow:hidden;margin-bottom:10px;background:#E7E1D8;z-index:0;transition:height .18s ease}
  #transitMap.big{height:70vh;max-height:none}
  #hotelMap{height:28vh;max-height:230px;border-radius:11px;overflow:hidden;margin-bottom:10px;background:#E7E1D8;z-index:0;transition:height .18s ease}
  #hotelMap.big{height:68vh;max-height:none}
  @media(min-width:900px){
    .split{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    .split .stickytop{position:static;padding-top:0}
    .split .stickytop #map{position:sticky;top:52px}
    .stickytop{top:52px}
    #map{height:420px;max-height:none;position:sticky;top:20px}
    #map.big{height:78vh}
    #transitMap{height:420px;max-height:none}
    #hotelMap{height:380px;max-height:none}
    #hotelMap.big{height:78vh}
  }
  .maplinks{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .maplinks a{font-size:12.5px}

  #dayList{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;gap:14px;padding:14px;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .edit-item{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--accent);font-size:13px;min-height:38px;padding:0 16px;border:1px solid var(--line2);border-radius:8px;background:#fff;-webkit-tap-highlight-color:transparent}
  .edit-item:active{background:rgba(63,74,90,.06)}
  .edit-item.icon-only{padding:0;width:42px;min-width:42px;height:42px;min-height:42px}
  #dayList .bdbox,.packrow .bdbox{flex-shrink:0}
  .gchev{transition:transform .18s ease;color:var(--gray2)}
  .gchev.open{transform:rotate(180deg)}
  .phandle{touch-action:none;cursor:grab;color:#C6CDDA;flex-shrink:0;display:flex;align-items:center}
  .packrow.pdragging{opacity:.4}
  .packrow.pover{box-shadow:0 -2px 0 0 var(--accent) inset}
  body.t2 .packrow.pover{box-shadow:0 -2px 0 0 var(--accent) inset;background:rgba(43,191,176,.06)}
  .packrow .edit-item.icon-only{width:34px;min-width:34px;height:34px;min-height:34px}
  .item.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .item .t{font-size:13px;color:var(--gray);min-width:42px;text-align:right;padding-top:2px}
  .item .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .item .name{font-size:15.5px;font-weight:550;letter-spacing:-.1px}
  .pin{width:20px;height:20px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);
       font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
  .pin.nomap{border-color:var(--line);color:var(--gray2)}
  .handle{touch-action:none;cursor:grab;color:#CFC7BC;fill:currentColor;padding-top:4px;flex-shrink:0}
  .item.dragging{opacity:.45}
  .item.overline{box-shadow:0 -2px 0 0 var(--accent) inset}
  .day.drop{color:var(--ink);font-weight:600}
  .day.drop .bar{background:var(--accent)}
  .kind{font-size:11px;color:var(--gray2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .cost{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:2px}
  .dot{color:#C4BCB1}
  .check{color:var(--paid);font-size:12px}
  .quick{display:flex;gap:14px;margin-top:6px}
  .quick a,.quick span{font-size:12px;color:var(--accent);cursor:pointer}

  .txt-btn{font-size:13.5px;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0}
  .btn{font-size:14px;font-weight:600;color:var(--surface);background:var(--accent);padding:11px 22px;border-radius:8px;border:0;cursor:pointer}
  .btn.ghost{background:none;color:var(--gray);font-weight:400}
  .empty{padding:24px 2px;font-size:13.5px;color:var(--gray2)}

  .burger{width:40px;height:40px;flex:0 0 auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .burger svg{width:19px;height:19px;stroke:var(--ink);stroke-width:1.7;fill:none;stroke-linecap:round}
  .burger.sm{width:32px;height:32px}.burger.sm svg{width:16px;height:16px}
  .hrow{display:flex;align-items:flex-start;gap:12px}
  .hrow .htext{flex:1;min-width:0}

  .drawer-bg{position:fixed;inset:0;z-index:1200;background:rgba(35,32,29,.3);opacity:0;pointer-events:none;transition:opacity .16s ease}
  .drawer-bg.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:250px;max-width:82vw;z-index:1201;background:var(--bg);
    border-inline-start:1px solid var(--line);box-shadow:-8px 0 28px rgba(35,32,29,.12);
    transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;
    padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
  html[dir="rtl"] .drawer{transform:translateX(-100%)}
  .drawer.on{transform:translateX(0) !important}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 12px;border-bottom:1px solid var(--line2);margin-bottom:10px}
  .drawer-head span{font-size:13px;color:var(--gray);letter-spacing:.02em}
  .navitem{display:flex;align-items:center;gap:11px;width:100%;min-height:46px;padding:0 10px;border:0;border-radius:10px;
    background:transparent;cursor:pointer;font:inherit;font-size:14.5px;color:var(--ink);text-align:start}
  .navitem svg{width:19px;height:19px;stroke:var(--gray);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .navitem.on{background:rgba(63,74,90,.08);color:var(--accent);font-weight:600}
  .navitem.on svg{stroke:var(--accent)}

  .filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-top:16px}
  .filecard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
  .filecard img{width:100%;height:104px;object-fit:cover;display:block;background:#EFEAE2;cursor:pointer}
  .filedoc{height:104px;display:flex;align-items:center;justify-content:center;background:#F4F0E9;font-size:26px;color:var(--gray2);cursor:pointer}
  .filemeta{padding:8px 9px;display:flex;flex-direction:column;gap:3px}
  .filemeta .nm{font-size:12px;line-height:1.3;word-break:break-word}
  .filemeta .rm{font-size:11px;color:var(--danger);background:none;border:0;padding:0;cursor:pointer;text-align:start}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--gray);
    font-size:13px;cursor:pointer;background:var(--surface)}
  .drop.hot{border-color:var(--accent);color:var(--accent)}
  .tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:transparent !important;border:0 !important;border-radius:14px !important;box-shadow:none !important;
    color:var(--gray2);cursor:pointer;font-size:11px;padding:8px 4px;margin:5px 3px;transition:background .15s ease}
  .tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--accent);background:rgba(143,148,251,.16) !important}
  .tab.on svg{stroke:var(--accent)}

  .sheet-bg{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;justify-content:center;background:rgba(35,32,29,.28)}
  .sheet-bg.on{display:flex}
  .sheet{position:relative;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);
    border-radius:16px 16px 0 0;padding:20px 22px calc(30px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:15px;font-weight:600;margin:0}
  .x{font-size:22px;color:var(--gray2);cursor:pointer;line-height:1;background:none;border:0}
  .detrow{display:flex;flex-direction:column;gap:3px;padding:13px 0;border-top:1px solid var(--line2)}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
  .field input,.field select,.field textarea{background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 0;width:100%;font-size:15px}
  .field textarea{resize:none;line-height:1.5}
  .pick{display:flex;gap:14px;padding:6px 0}
  .pick span{font-size:14px;color:var(--gray2);cursor:pointer;border-bottom:1.5px solid transparent;padding-bottom:2px}
  .pick span.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .two{display:flex;gap:14px}
  .two>*{flex:1}

  .exp{display:flex;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line2);align-items:flex-start}
  .exp .b{flex:1;min-width:0}
  .exp .amt{text-align:left;flex-shrink:0}
  .chev{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
  .chev svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .18s ease}
  .chev.open svg{transform:rotate(180deg)}
  .panel{margin-top:12px;padding-top:6px;border-top:1px solid var(--line2)}
  .prow{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line2)}
  .prow input,.prow textarea{background:transparent;border:0;padding:2px 0;width:100%;font-size:13.5px;line-height:1.5;font-family:inherit}
  .prow textarea{resize:none}
  .btn[disabled]{background:#EDE8E0;color:var(--gray2);cursor:default}
  .pin.tap{cursor:pointer}
  .formcard{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:#E9F0FA;padding:14px 14px 12px}
  .formcard .field{margin-bottom:12px}
  .formcard .field input,.formcard .field select,.formcard .field textarea{
    background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14.5px;
    width:100%;max-width:100%;min-width:0;display:block}
  .formcard{overflow-x:hidden}
  .formcard .estbox{flex-wrap:wrap;justify-content:flex-end;min-width:0;flex-shrink:1}
  .formcard .estbox input{min-width:0}
  .formcard textarea{resize:vertical}
  .formcard .pick span{background:#FFFFFF;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12.5px}
  .formcard .pick span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .estchip{background:#EDF1F7;border:1px solid #DCE3ED;border-radius:6px;padding:3px 8px;color:var(--gray)}
  .estbox{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .estbox input{width:86px;font-size:14px;text-align:right;direction:ltr;background:#F1EDE6;border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .okbtn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--accent);
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .okbtn.hot{border-color:var(--accent);background:var(--accent);color:var(--surface)}
  .meth{display:flex;gap:2px;flex-shrink:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .meth span{font-size:11.5px;padding:5px 8px;cursor:pointer;color:var(--gray2);background:transparent}
  .meth span.on{background:var(--accent);color:var(--surface)}
  @media(max-width:430px){
    .estbox{gap:6px}
    .estbox input{width:74px;font-size:13.5px;padding:6px 7px}
    .meth span{font-size:11px;padding:5px 7px}
    .formcard{padding:12px 12px 10px}
    .formcard .field input,.formcard .field select,.formcard .field textarea{font-size:14px}
  }
  .status-btn{font-size:12px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0;margin-top:3px}


  /* ===== עיצוב חלופי (t2) - השראה: ערכת נסיעות טורקיז ===== */
  body.t2{
    --bg:#EDF0F8; --surface:#FFFFFF; --ink:#2F3E4A; --ink2:#4C6070;
    --gray:#8794A3; --gray2:#A3AEBB; --line:#E4E9F2; --line2:#EDF1F7;
    --accent:#2BBFB0; --paid:#2BBFB0; --checked:#48606F;
    font-family:Poppins,"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  body.t2 .wrap{position:relative;max-width:100%;display:flex;flex-direction:column;padding:0 0 calc(40px + env(safe-area-inset-bottom))}
  body.t2 .hero{order:-2;height:350px;border-radius:0;margin:0;width:100%;
    object-fit:contain;object-position:50% 0;background:#D9E0EF;filter:saturate(.72) brightness(1.04)}
  body.t2.herocover .hero{object-fit:cover;object-position:50% 40%}
  body.t2.herosm .hero{height:175px}
  body.t2 .hrow{position:absolute;top:30px;inset-inline:18px;z-index:3;margin:0;align-items:center}
  body.t2 .hrow .htext{text-align:left;padding:24px 0 14px;direction:ltr}
  body.t2 .hrow h1{color:#fff;font-size:36px;font-weight:600;letter-spacing:1px;text-shadow:0 2px 6px rgba(0,0,0,.55),0 2px 26px rgba(0,0,0,.45)}
  body.t2 .hrow .sub{display:none;color:var(--ink);background:#fff;border-radius:100px;
    padding:6px 14px;font-size:12.5px;text-shadow:none;box-shadow:0 3px 12px rgba(47,62,74,.18);margin-top:8px}
  body.t2 .burger{background:#fff;border:0;border-radius:50%;box-shadow:0 4px 14px rgba(47,62,74,.18)}
  body.t2 .burger svg{stroke:var(--ink)}
  body.t2 .burger.sm svg{stroke:var(--ink)}
  body.t2 .hrow{gap:8px}
  .updrow{display:none}
  body.t2 .updrow{cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    background:#fff;border-radius:100px;padding:5px 12px;font-size:11.5px;color:var(--ink2);
    box-shadow:0 3px 12px rgba(47,62,74,.16)}
  body.t2 .stickybar{position:sticky;top:0;z-index:60;order:-1;align-items:center;gap:10px;background:var(--bg);border-bottom:0;
    padding:calc(8px + env(safe-area-inset-top)) 16px 8px;box-shadow:0 4px 14px rgba(47,62,74,.08)}
  body.t2 .stickybar .sb-title{font-size:19px;font-weight:600;letter-spacing:.3px;order:4;margin-inline-start:auto}
  body.t2 .stickybar .sb-sub{display:none}
  body.t2 .stickybar #burgerSm{order:1}
  body.t2 .stickybar #passportsSm{order:2}
  body.t2 .stickybar #disneyMapSm{order:3}
  .disneybtn{display:none !important}
  body.disneyday .disneybtn{display:flex !important}
  body.t2 .stickybar .burger.sm{background:#fff;border:0;border-radius:50%;width:34px;height:34px;
    box-shadow:0 3px 10px rgba(47,62,74,.16)}
  body.t2 .stickybar .burger.sm svg{stroke:var(--ink)}
  body.t2 .updrow.busy svg{animation:updspin .6s cubic-bezier(.4,0,.2,1)}
  body.t2 .updrow svg{width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  body.t2 main#view{position:relative;z-index:2;background:var(--bg);border-radius:28px 28px 0 0;
    margin-top:-40px;padding:4px 16px 0}
  body.t2 .stickytop,body.t2 .stickyhead,body.t2 .stickywrap{top:50px;padding-top:14px;padding-bottom:10px}

  body.t2 .days{gap:9px;margin-bottom:16px}
  body.t2 .day{background:#fff !important;border-radius:100px !important;padding:10px 16px 10px !important;
    font-size:13px;color:var(--gray);box-shadow:0 2px 10px rgba(47,62,74,.06) !important}
  body.t2 .day.on{background:#DCE3F2 !important;color:var(--ink)}

     freeText:"פריז הקלאסית למשפחות\n\nסיור נפלא להכרת העיר, התרבות הפריזאית וההסטוריה המרתקת. הסיור נערך ברובע הלטיני, באיל דה לה סיטה וברובע הרביעי של פריז והוא מאד מגוון ומשלב מונומנטים ידועים, היכרות עם פריז של היום, אמנות רחוב, אנקדוטות הסטוריות חשובות ואוכל טעים.\n\nבמהלך הסיור נבקר בין היתר במקומות הבאים:\n\nבניין פומפידו\nאיזורי הגרפיטי האיקונים בעיר העתיקה ועבודותיו של אמן הרחוב הצרפתי הכי מפורסם.\nנזרקת סטרווינסקי\nמבנה גותי יפייפה שם תגלו את סודות הבנייה הגותית המאפיינת את אירופה.\nבניין העירייה המרהיב של פריז - Hôtel de Ville.\nקתדרלת נוטרדאם\nאיל דה לה סיטה\nרחוב \"היונים\"\nמגדל סן ז'אק - אחד הסמלים למהפכה הצרפתית\nהיכרות מרתקת עם המלכים והמלכות של צרפת (לואי ה-14, לואי ה-16 ומארי אנטואנט)\nהרובע הלטיני\nתצפית על האייפל ועל הקונסיירז'רי המרהיב\nמזרקת סן מישל\nנבקר בפטיסרי מעולה ונכיר את המאפים והקינוחים המפורסמים של צרפת.\n\nמשך הסיור: שעתיים וחצי עד שלוש שעות"},

function sectionOf(group){ return SECTION_OF[group] || "כללי"; }

function buildPacking(){
  const out = [];
  PACKING_SEED.forEach(([group, items])=>items.forEach(([name], k)=>
    out.push({id:"p-"+group.replace(/\s/g,"")+"-"+k, group, section:sectionOf(group), name, done:false})));
  return out;
}

function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if(raw) raw = raw.replace(/(?:uploads|img)\/(pasted-[\w-]+)\.(?:png|jpg)/g, "$1.png");
    if(raw){
      const t = normalize(JSON.parse(raw));
      if(!t.settings) t.settings = {};
      if(t.settings.schedVer !== SCHEDULE_VERSION){
        t.activities = JSON.parse(JSON.stringify(INITIAL_TRIP.activities));
        t.settings.schedVer = SCHEDULE_VERSION;
      }
      return t;
    }
  }catch(e){}
  // ייבוא מגרסה ישנה (הנתונים הישנים לא נמחקים)
  for(const k of LEGACY){
    try{
      const raw = localStorage.getItem(k);
      if(!raw) continue;
      const old = JSON.parse(raw);
      if(old && Array.isArray(old.activities) && old.activities.length){
        return normalize(migrate(old.activities));
      }
    }catch(e){}
  }
  const fresh = normalize(JSON.parse(JSON.stringify(INITIAL_TRIP)));
  fresh.settings.schedVer = SCHEDULE_VERSION;
  return fresh;
}
function migrate(oldActs){
  const t = {activities:[], hotels:[], transport:[], expenses:[], settings:{weather:"",tab:"itinerary",date:""}};
  const base = JSON.parse(JSON.stringify(INITIAL_TRIP));
  const HOTEL_KEYS = [{re:/pergo/i, id:"h1"}, {re:/marriott/i, id:"h2"}];
  const addHotel = (id, a) => {
    const h = base.hotels.find(x=>x.id===id); if(!h) return;
    if(!t.hotels.some(x=>x.id===id)){
      if(a && Number(a.price)>0){ h.price = a.price; h.status = a.status || h.status; }
      t.hotels.push(h);
    }
  };
  const parseRoute = name => {
    const m = String(name).replace(/^(מונית|ואן|מונית\/ואן|הסעה|אוטובוס)\s*/,"").split(/\s*(?:→|->|-|\u2192)\s*/);
    return {from:(m[0]||"").trim(), to:(m[1]||"").trim()};
  };

  oldActs.forEach(a=>{
    const name = String(a.name||"");
    const hotelHit = HOTEL_KEYS.find(k=>k.re.test(name));
    if(hotelHit && /צ׳ק|לילות/.test(name)){ addHotel(hotelHit.id, a); return; }
    if(/טיסה/.test(name)){
      const f = base.transport.find(x=>x.kind==="flight" && x.date===a.date);
      if(f){ if(!t.transport.some(x=>x.id===f.id)) t.transport.push(f); return; }
    }
    if(/^(מונית|ואן|מונית\/ואן|הסעה)/.test(name)){
      const r = parseRoute(name);
      t.transport.push({id:String("t-"+(a.id||uid("t"))).replace(/:/g,"-"), kind:"taxi", date:a.date, time:a.time,
        from:r.from, to:r.to, price:a.price, currency:a.currency||"EUR",
        status:a.status, notes:a.notes||"", name});
      return;
    }
    if(/^נחיתה/.test(name)) return;   // הנחיתה מיוצגת ברשומת הטיסה
    const ref = base.activities.find(x=>x.name===name);
    t.activities.push(Object.assign({}, ref||{}, {
      id:a.id||uid("a"), date:a.date, time:a.time, name, price:a.price,
      currency:a.currency||"EUR", status:a.status, address:a.address||(ref?ref.address:"")||"",
      notes:a.notes||"", transport:a.transport||"", openingHours:a.openingHours||"",
      officialWebsite:a.officialWebsite||(ref?ref.officialWebsite:"")||""
    }));
  });
  base.hotels.forEach(h=>{ if(!t.hotels.some(x=>x.id===h.id)) t.hotels.push(h); });
  base.transport.forEach(x=>{ if(x.kind==="flight" && !t.transport.some(y=>y.number===x.number)) t.transport.push(x); });
  return t;
}
function normalize(t){
  t = t || {};
  t.files = t.files || [];
  if(!Array.isArray(t.birthday) || !t.birthday.length){
    t.birthday = ["עוגת יומולדת","ממתקים","קישוטים","בלונים","שלט יומולדת","ברכות","מתנה"]
      .map((n,i)=>({id:"b"+i, name:n, done:false, note:""}));
  }
  t.activities = t.activities || []; t.hotels = t.hotels || [];
  t.transport = t.transport || []; t.expenses = t.expenses || []; t.packing = t.packing || [];
  t.settings = Object.assign({weather:"",tab:"itinerary",date:""}, t.settings||{});
  return repair(t);
}

/* ניקוי כפילויות שנוצרו בייבוא מגרסאות קודמות */
function repair(t){
  t.activities = t.activities.filter(a=>{
    const name = String(a.name||"");
    if(/^צ׳ק-(אין|אאוט)/.test(name)){
      const hit = t.hotels.some(h=>{
        const key = /marriott/i.test(h.name) ? /marriott/i : (/pergo/i.test(h.name) ? /pergo/i : null);
        return key ? key.test(name) : name.indexOf(h.name)>=0;
      });
      if(hit) return false;
    }
    if(/^נחיתה/.test(name) && t.transport.some(x=>x.kind==="flight" && x.date===a.date)) return false;
    return true;
  });
  if(!t.settings.addedPsg && !t.activities.some(a=>/PSG|Parc des Princes/i.test(a.name||""))){
    const psg = INITIAL_TRIP.activities.find(a=>a.id==="a13");
    if(psg && t.activities.length) t.activities.push(JSON.parse(JSON.stringify(psg)));
    t.settings.addedPsg = true;
  }
  if(!t.settings.cruiseNameFix){
    const c = t.activities.find(a=>/שייט בס(י)?ן/.test(a.name||""));
    if(c) c.name = "שייט בסן";
    t.settings.cruiseNameFix = true;
  }
  if(!t.settings.psgTicketLink){
    const psg = t.activities.find(a=>/PSG|Parc des Princes/i.test(a.name||""));
    if(psg){ psg.confirmation = "3100575"; }
    t.settings.psgTicketLink = true;
  }
  if(!t.settings.psgOrderNote){
    const psg = t.activities.find(a=>/PSG|Parc des Princes/i.test(a.name||""));
    if(psg){ psg.confirmation = "3100575"; psg.notes = "מספר הזמנה 3100575 · הכרטיסים באזור האישי באתר PSG."; }
    t.settings.psgOrderNote = true;
  }
  if(!t.settings.addedCruise && !t.activities.some(a=>/שייט בסן/.test(a.name||""))){
    const c = INITIAL_TRIP.activities.find(a=>a.id==="a14");
    if(c && t.activities.length) t.activities.push(JSON.parse(JSON.stringify(c)));
    t.settings.addedCruise = true;
  }
  if(!t.settings.flightBoardLink2){
    const f1 = (t.transport||[]).find(x=>x.id==="t1");
    if(f1){ f1.website = LINKS.tlvBoard; f1.appUrl = LINKS.tlvBoard; }
    const f5 = (t.transport||[]).find(x=>x.id==="t5");
    if(f5){ f5.website = LINKS.cdgBoard; f5.appUrl = LINKS.cdgBoard; }
    t.settings.flightBoardLink2 = true;
  }
  if(!t.settings.removedSeaGroup2){
    const keep = /בגד\s*ים|בגדי ים|משקפ|קרוקס|מצופ/;
    t.packing = (t.packing||[]).filter(p=>p.group!=="דברים לים" || keep.test(p.name||""));
    (t.packing||[]).forEach(p=>{ if(p.group==="דברים לים"){ p.group="בריכה"; p.section="כללי"; } });
    const base = buildPacking().filter(p=>p.group==="דברים לים" && keep.test(p.name||""));
    base.forEach(b=>{
      if(!(t.packing||[]).some(p=>p.name===b.name)){
        t.packing.push(Object.assign({}, b, {id:"p"+Math.random().toString(36).slice(2), group:"בריכה", section:"כללי"}));
      }
    });
    t.settings.removedSeaGroup = true;
    t.settings.removedSeaGroup2 = true;
  }
  if(!t.settings.addedPacking){
    if(!t.packing.length) t.packing = buildPacking();
    t.settings.addedPacking = true;
  }
  t.packing.forEach(p=>{ if(!p.section) p.section = sectionOf(p.group); });
  if(!t.settings.amountRepair){
    const fix = (r, k)=>{
      const est = Number(r.estimate), cur = Number(r[k]);
      if(est && cur && cur < est/100) r[k] = est;
    };
    (t.hotels||[]).forEach(h=>fix(h,"price"));
    (t.transport||[]).forEach(x=>{ fix(x,"price"); if(x.finalPrice && Number(x.finalPrice) < Number(x.estimate||0)/100) x.finalPrice = x.price; });
    (t.activities||[]).forEach(a=>fix(a,"price"));
    (t.expenses||[]).forEach(e=>fix(e,"amount"));
    t.settings.amountRepair = true;
  }
  if(!t.settings.idsClean){
    ["activities","hotels","transport","expenses","packing"].forEach(k=>{
      (t[k]||[]).forEach(r=>{ if(r.id && String(r.id).indexOf(":")>=0) r.id = String(r.id).replace(/:/g,"-"); });
    });
    t.settings.idsClean = true;
  }
  if(!t.settings.dayLastVillage){
    const a = t.activities.find(x=>/Disney - יום 3/.test(x.name||""));
    const seed = INITIAL_TRIP.activities.find(x=>x.id==="a12");
    if(a && seed) Object.assign(a, {name:seed.name, address:seed.address, lat:seed.lat, lng:seed.lng,
      price:null, status:"estimated", transport:seed.transport, notes:seed.notes});
    t.settings.dayLastVillage = true;
  }
  if(!t.settings.settledFlag){
    t.transport.forEach(x=>{ if(x.kind==="flight") x.settled = true; });
    t.hotels.forEach(h=>{ if(/pergo/i.test(h.name||"")) h.settled = true; });
    t.settings.settledFlag = true;
  }
  if(!t.settings.packingReset){
    t.packing.forEach(p=>p.done = false);
    t.settings.packingReset = true;
  }
  if(!t.settings.addedPsgText){
    const seedPsg = INITIAL_TRIP.activities.find(a=>a.id==="a13");
    const mine = t.activities.find(a=>/PSG|Parc des Princes/i.test(a.name||""));
    if(mine && !mine.freeText && seedPsg) mine.freeText = seedPsg.freeText;
    t.settings.addedPsgText = true;
  }
  t.transport.forEach(x=>{
    if(x.name && !x.from && !x.to){
      const parts = String(x.name).replace(/^(מונית\/ואן|מונית|ואן|הסעה|אוטובוס)\s*/,"")
        .split(/\s*(?:→|->|-)\s*/);
      x.from = (parts[0]||"").trim(); x.to = (parts[1]||"").trim();
    }
    if(x.name) delete x.name;
  });
  return t;
}

const MONTHS = ["בינואר","בפברואר","במרץ","באפריל","במאי","ביוני","ביולי","באוגוסט","בספטמבר","באוקטובר","בנובמבר","בדצמבר"];

const KINDS = {flight:"טיסה", train:"רכבת", bus:"אוטובוס", taxi:"מונית", transfer:"הסעה"};

function money(n, cur){
  const r = Math.round((Number(n)||0)*100)/100;
  const s = Number.isInteger(r) ? r.toLocaleString("en-US")
    : r.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (cur==="ILS" ? "₪" : "€") + s;
}
function heDate(iso){ const d=new Date(iso+"T00:00:00"); return d.getDate()+" "+MONTHS[d.getMonth()]; }
function shortDate(iso){ const d=new Date(iso+"T00:00:00"); return d.getDate()+" "+MON_S[d.getMonth()]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function mapsUrl(q){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q); }

function costHtml(price, currency, status, firm){
  if(price===null || price===undefined || price==="") return '';
  const p = Number(price)||0;
  if(!p) return '<div class="cost"><span>חינם</span></div>';
  if(status==="estimated" && !firm){
    return '<div class="cost"><span class="estchip num">~'+esc(money(p,currency))+'</span>'+
      '<span style="color:var(--gray2)">משוער</span></div>';
  }
  return '<div class="cost"><span class="num">'+esc(money(p,currency))+'</span><span class="dot">·</span><span>'+
    esc(STATUS[status]||"")+'</span>'+(status==="paid"?'<span class="check">✓</span>':'')+'</div>';
}

/* כל התאריכים של הטיול, מכל הרשומות */
function allDates(){
  const set = {};
  trip.activities.forEach(a=>a.date && (set[a.date]=1));
  trip.transport.forEach(t=>t.date && (set[t.date]=1));
  trip.hotels.forEach(h=>{ if(h.checkIn) set[h.checkIn]=1; if(h.checkOut) set[h.checkOut]=1; });
  trip.expenses.forEach(e=>e.date && (set[e.date]=1));
  return Object.keys(set).sort();
}
function defaultDate(){
  const ds = allDates(); if(!ds.length) return "";
  const today = new Date().toISOString().slice(0,10);
  return ds.includes(today) ? today : (ds.find(d=>d>=today) || ds[0]);
}

/* פריטי הלו״ז של יום: פעילויות + תחבורה + צ׳ק-אין/אאוט */
function dayItems(date){
  const out = [];
  trip.activities.filter(a=>a.date===date).forEach(a=>out.push({kind:"activity", rec:a, time:a.time,
    name:a.name, address:a.address, lat:a.lat, lng:a.lng, price:a.price, currency:a.currency, status:a.status}));
  trip.transport.filter(t=>t.date===date).forEach(t=>out.push({kind:"transport", rec:t, time:t.time,
    name:(t.kind==="flight" ? (t.operator?t.operator+" ":"")+(t.number||"") : KINDS[t.kind]||"נסיעה")+
      (t.from||t.to ? "  "+(t.from||"")+" → "+(t.to||"") : (t.name ? "  "+t.name : "")),
    address:"", price:t.price, currency:t.currency, status:t.status,
    detail:(t.kind==="flight" ? "המראה "+(t.time||"")+" · נחיתה "+(t.arriveTime||"") : "")}));
  trip.hotels.forEach(h=>{
    if(h.checkIn===date) out.push({kind:"hotel", rec:h, time:h.checkInTime||"", name:"צ׳ק-אין "+h.name,
      address:h.address, lat:h.lat, lng:h.lng, price:h.price, currency:h.currency, status:h.status, event:"in"});
    if(h.checkOut===date) out.push({kind:"hotel", rec:h, time:h.checkOutTime||"", name:"צ׳ק-אאוט "+h.name,
      address:h.address, lat:h.lat, lng:h.lng, price:0, currency:h.currency, status:h.status, event:"out"});
  });
  out.forEach(i=>{
    i.order = (i.kind==="hotel") ? i.rec[i.event==="in"?"orderIn":"orderOut"] : i.rec.order;
  });
  const key = i => (String(i.time||"").match(/^\d{1,2}:\d{2}$/) ? Number(i.time.replace(":","")) : 9999);
  out.sort((x,y)=>{ const a=key(x), b=key(y); return a===b ? String(x.name||"").localeCompare(String(y.name||"")) : a-b; });
  let n = 0;
  out.forEach(i=>{ i.num = ++n; if(i.lat!=null && i.lng!=null) i.pin = i.num; });
  return out;

function allExpenses(){
  const rows = [];
  trip.activities.forEach(a=>{ if(Number(a.price)) rows.push({
    sourceType:"activity", sourceId:a.id, date:a.date, description:a.name,
    type:a.type||"פעילות", amount:a.price, currency:a.currency||"EUR", status:a.status, settled:!!a.settled, rec:a}); });
  trip.hotels.forEach(h=>{ if(Number(h.price)) rows.push({
    sourceType:"hotel", sourceId:h.id, date:h.checkIn, description:h.name+" · "+(h.nights||"")+" לילות",
    type:"מלון", amount:h.price, currency:h.currency||"EUR", status:h.status, settled:!!h.settled, rec:h}); });
  trip.transport.forEach(t=>{ if(Number(t.price)) rows.push({
    sourceType:"transport", sourceId:t.id, date:t.date,
    description:(t.kind==="flight" ? (t.operator||"")+" "+(t.number||"") : KINDS[t.kind]||"נסיעה")+
      (t.from||t.to ? " · "+(t.from||"")+" → "+(t.to||"") : (t.name ? " · "+t.name : "")),
    type:t.kind==="flight"?"טיסה":(t.kind==="train"?"רכבת":"תחבורה"),
    amount:t.price, currency:t.currency||"EUR", status:t.status, settled:!!t.settled, rec:t}); });
  trip.expenses.forEach(e=>rows.push({
    sourceType:"expense", sourceId:e.id, date:e.date, description:e.description,
    type:e.type||"אחר", amount:e.amount, currency:e.currency||"EUR", status:e.status, settled:!!e.settled, rec:e}));
  rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return rows;
}
function totals(rows){
  const t = {EUR:{paid:0,known:0,estimated:0}, ILS:{paid:0,known:0,estimated:0}};
  rows.forEach(r=>{ const c = r.currency==="ILS"?"ILS":"EUR"; t[c][r.status||"estimated"] += Number(r.amount)||0; });
  t.EUR.total = t.EUR.paid+t.EUR.known+t.EUR.estimated;
  t.ILS.total = t.ILS.paid+t.ILS.known+t.ILS.estimated;
  return t;
}

function dataUriToBlobUrl(uri){
  try{
    const parts = String(uri).split(",");
    const mime = (parts[0].match(/data:([^;]+)/)||[])[1] || "application/octet-stream";
    const bin = atob(parts[1]);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr], {type:mime}));
  }catch(e){ return null; }
}
let docUrl = null;
let pdfjsP = null, docZoom = 1, docJob = 0;
function loadPdfJs(){
  if(pdfjsP) return pdfjsP;
  pdfjsP = new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = ()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); };
    s.onerror = rej; document.head.appendChild(s);
  });
  return pdfjsP;
}
function applyDocZoom(){
  document.querySelectorAll("#docPages canvas").forEach(c=>{ c.style.width = Math.round(docZoom*100)+"%"; c.style.maxWidth = docZoom>1 ? "none" : "900px"; });
  document.getElementById("docPages").style.alignItems = docZoom>1 ? "flex-start" : "center";
}
function openDoc(uri, name){
  if(!uri) return;
  const v = document.getElementById("docView"), box = document.getElementById("docPages");
  const job = ++docJob; docZoom = 1;
  box.innerHTML = '<div style="color:#fff;font-size:14px;padding:40px">טוען…</div>';
  v.classList.add("on");
  document.body.style.overflow = "hidden";
  let src = uri;
  if(/^data:/.test(uri)){ try{ const b64 = uri.split(",")[1]; const bin = atob(b64); const u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); src = {data:u8}; }catch(e){} }
  else src = {url: new URL(uri, location.href).href};
  loadPdfJs().then(lib=>lib.getDocument(src).promise).then(async pdf=>{
    if(job!==docJob) return;
    box.innerHTML = "";
    const w = Math.min(box.clientWidth - 16, 900);
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    for(let n=1; n<=pdf.numPages; n++){
      if(job!==docJob) return;
      const page = await pdf.getPage(n);
      const vp1 = page.getViewport({scale:1});
      const vp = page.getViewport({scale: Math.min(3, (w/vp1.width)*dpr*1.25)});
      const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height;
      c.style.cssText = "display:block;width:100%;max-width:900px;height:auto;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);flex-shrink:0";
      box.appendChild(c);
      applyDocZoom();
      await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
    }
  }).catch(()=>{
    if(job!==docJob) return;
    box.innerHTML = '<div style="color:#fff;font-size:14px;padding:40px;text-align:center">לא ניתן להציג את המסמך.<br><a style="color:#fff" href="'+uri+'" target="_blank" rel="noopener">פתיחה בחלון חדש</a></div>';
  });
}

const WX_LOC = {paris:[48.8566,2.3522], disney:[48.8722,2.7758]};
function wxText(c){
  if(c===0) return "בהיר"; if(c<=2) return "מעונן חלקית"; if(c===3) return "מעונן";
  if(c<=48) return "ערפל"; if(c<=57) return "טפטוף"; if(c<=67) return "גשם";
  if(c<=77) return "שלג"; if(c<=82) return "ממטרים"; if(c<=86) return "שלג"; return "סופות רעמים";
}
function wxLocFor(d){ return (trip.activities||[]).some(a=>a.date===d && /disney/i.test(a.name||"")) ? "disney" : "paris"; }
function wxIcon(c){
  if(c===0) return "☀️"; if(c===1) return "🌤️"; if(c===2) return "⛅"; if(c===3) return "☁️";
  if(c<=48) return "🌫️"; if(c<=57) return "🌦️"; if(c<=67) return "🌧️"; if(c<=77) return "🌨️";
  if(c<=82) return "🌦️"; if(c<=86) return "🌨️"; return "⛈️";
}
function weatherIconFor(d){ const r = WX[wxLocFor(d)]; const day = r && r.days && r.days[d]; return day ? wxIcon(day.c) : ""; }
function weatherFor(d){
  const r = WX[wxLocFor(d)]; const day = r && r.days && r.days[d];
  if(!day) return "";
  return wxText(day.c)+" \u2066"+Math.round(day.hi)+"°/"+Math.round(day.lo)+"°\u2069"+(day.p!=null?" · גשם "+day.p+"%":"");
}
function fetchWeather(){
  const fresh = k => WX[k] && Date.now()-WX[k].t < 3*3600*1000;
  Object.entries(WX_LOC).forEach(([k,[lat,lng]])=>{
    if(fresh(k)) return;
    fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lng+"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FParis&forecast_days=16")
      .then(r=>r.json()).then(j=>{
        const days = {}; const D = j.daily||{};
        (D.time||[]).forEach((t,i)=>{ days[t] = {c:D.weather_code[i], hi:D.temperature_2m_max[i], lo:D.temperature_2m_min[i], p:D.precipitation_probability_max?D.precipitation_probability_max[i]:null}; });
        WX[k] = {t:Date.now(), days};
        try{ localStorage.setItem(WX_KEY, JSON.stringify(WX)); }catch(e){}
        if(tab==="itinerary") render(); else renderHeader();
      }).catch(()=>{});
  });
}

/* מפות בסיס (נתוני OpenStreetMap). נבחר הראשון שמחזיר אריח אמיתי. */
const OSM_ATTR = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
const TILE_PROVIDERS = [
  {url:"https://tile.openstreetmap.de/{z}/{x}/{y}.png", attr:OSM_ATTR+' · <a href="https://openstreetmap.de/" target="_blank" rel="noopener">OSM Deutschland</a>'},
  {url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", attr:OSM_ATTR},
  {url:"https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", sub:"abc", attr:OSM_ATTR+' · <a href="https://opentopomap.org/" target="_blank" rel="noopener">OpenTopoMap</a>'}
];
let chosenTiles = null;
async function pickTiles(){
  if(chosenTiles) return chosenTiles;
  for(const p of TILE_PROVIDERS){
    const probe = p.url.replace("{s}","a").replace("{z}","15").replace("{x}","16597").replace("{y}","11268");
    try{
      const r = await fetch(probe, {cache:"no-store"});
      if(r.ok){ const b = await r.blob(); if(b.size > 3000){ chosenTiles = p; return p; } }
    }catch(e){}
  }
  chosenTiles = TILE_PROVIDERS[0];
  return chosenTiles;
}
function addTiles(target){
  pickTiles().then(p=>{
    if(target !== map) return;
    L.tileLayer(p.url, {maxZoom:19, subdomains:p.sub||"abc", attribution:p.attr}).addTo(target);
  });
}

function setupMap(){
  const box = document.getElementById("map");
  if(!box || !window.L) return;
  const items = dayItems(selDate).filter(i=>i.lat!=null && i.lng!=null);
  if(map){ map.remove(); map=null; }
  markers = [];
  box.classList.toggle("big", mapBig && !mapSmall);
  box.classList.toggle("small", mapSmall);
  map = L.map(box, {zoomControl:mapBig && !mapSmall, attributionControl:true});
  addTiles(map);
  if(!items.length){ map.setView([48.8566,2.3522],11); return; }
  const bounds = [];
  items.forEach(i=>{
    const idx = dayItems(selDate).findIndex(x=>x.rec===i.rec && x.time===i.time);
    const m = L.marker([i.lat,i.lng], {icon:L.divIcon({className:"", html:'<div class="marker num">'+i.num+'</div>', iconSize:[24,24], iconAnchor:[12,12]})}).addTo(map);
    m.bindPopup('<div style="font-size:13px"><b>'+esc(i.name)+'</b><br><span style="color:#8A8279">'+esc(i.time||"")+'</span></div>');

const PENCIL = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function listOf(type){
  return type==="activity"?trip.activities:(type==="hotel"?trip.hotels:(type==="transport"?trip.transport:(type==="packing"?trip.packing:trip.expenses)));
}
function methToggle(type, rec){
  return '<div class="meth" data-methbox="1">'+['מזומן','אשראי'].map(m=>
    '<span class="'+(rec.method===m?"on":"")+'" data-rowmeth="'+m+'" data-rowref="'+type+':'+esc(rec.id)+'">'+m+'</span>').join("")+'</div>';
}
function parseAmount(v){
  let t = String(v==null?"":v).replace(/[^0-9.,]/g,"");
  if(t.indexOf(".")>=0 && t.indexOf(",")>=0) t = t.replace(/,/g,"");
  else if((t.match(/,/g)||[]).length===1 && !/\d{3}$/.test(t.split(",")[1]||"")) t = t.replace(",",".");
  else t = t.replace(/,/g,"");
  const parts = t.split(".");
  if(parts.length>2) t = parts.slice(0,-1).join("")+"."+parts[parts.length-1];
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}
function costCtl(type, rec, key){
  const cur = rec.currency||"EUR";
  const amt = Number(rec[key])||0;
  const editing = !!editCost[rec.id];
  if(rec.status==="paid" && !editing){
    return '<div style="text-align:left">'+
      '<div class="num" style="font-size:14.5px">'+(amt?money(amt,cur):"")+' <span class="check">✓</span>'+
        '<span '+(onExpenseScreen?'data-expedit="'+type+':'+esc(rec.id)+'"':'data-editcost="'+esc(rec.id)+'"')+' title="עריכה" style="display:inline-flex;vertical-align:middle;margin-inline-start:7px;cursor:pointer;color:var(--gray2)">'+PENCIL+'</span>'+
      '</div>'+
      (rec.method?'<div class="tiny" style="margin-top:3px">'+esc(rec.method)+'</div>':'')+
    '</div>';
  }
  return '<div class="estbox">'+methToggle(type, rec)+
    '<button class="okbtn" data-cok="1" data-ctype="'+type+'" data-cid="'+esc(rec.id)+'" data-ckey="'+key+'" title="אישור העלות">✓</button>'+
    '<input data-cost="1" value="'+esc(amt?String(amt):"")+'">'+
  '</div>';
}

    {k:"finalPrice", l:"סכום סופי אחרי הנסיעה", ltr:true, hint:"מתווסף להוצאות ברגע השמירה"},

function isOpen(type, id){
  const key = type+":"+id;
  return openCard===key;
}
function cardToggle(type, id, label){
  const key = type+":"+id, open = isOpen(type,id);
  return '<button class="chev'+(open?" open":"")+'" data-card="'+key+'"><span>'+
    esc(open?"סגירה":label)+'</span>'+CHEV+'</button>';
}
function cardPanel(type, id){
  if(!isOpen(type,id)) return "";
  const rec = findRec(type, id); if(!rec) return "";
  const isFlight = type==="transport" && rec.kind==="flight";
  const rows = PANEL_FIELDS[type].filter(f=>{
    if(f.flightOnly && !isFlight) return false;
    if((f.k==="estimate"||f.k==="finalPrice") && isFlight) return false;
    return true;
  }).map(f=>{
    let v = rec[f.k]==null ? "" : rec[f.k];
    if(f.k==="estimate") v = (rec.estimate!=null && rec.estimate!=="") ? rec.estimate : (rec.status!=="paid" ? rec.price : "");
    const style = (f.ltr?' dir="ltr" style="text-align:right'+(f.locked?';color:var(--gray2)':'')+'"':'');
    const attrs = 'data-inline="'+f.k+'"'+style+(f.locked?' disabled':'');
    return '<div class="prow"><div class="tiny">'+esc(f.l)+
      (f.hint?' <span style="color:var(--gray2)">· '+esc(f.hint)+'</span>':'')+'</div>'+
      (f.area ? '<textarea '+attrs+' rows="3">'+esc(v)+'</textarea>'
              : '<input '+attrs+' value="'+esc(v)+'">')+'</div>';
  }).join("");
  const links = [];
  if(rec.website) links.push('<a href="'+esc(rec.website)+'" target="_blank" rel="noopener">אתר רשמי</a>');
  if(rec.appUrl && rec.appUrl!==rec.website) links.push('<a href="'+esc(rec.appUrl)+'" target="_blank" rel="noopener">אפליקציה</a>');
  if(rec.ticketUrl) links.push('<a href="'+esc(rec.ticketUrl)+'" target="_blank" rel="noopener">כרטיס</a>');
  if(rec.bookingUrl) links.push('<a href="'+esc(rec.bookingUrl)+'" target="_blank" rel="noopener">ההזמנה</a>');
  if(rec.phone) links.push('<a class="ltr" href="tel:'+esc(rec.phone)+'">'+esc(rec.phone)+'</a>');
  if(rec.address) links.push('<a href="'+mapsUrl(rec.address)+'" target="_blank" rel="noopener">Google Maps</a>');
  return '<div class="panel" data-panel="1">'+rows+
    (links.length?'<div class="quick" style="margin-top:12px;gap:16px;flex-wrap:wrap">'+links.join("")+'</div>':'')+
    '<div class="row" style="gap:20px;margin-top:14px">'+
      '<button class="btn" data-inlinesave="'+type+':'+id+'"'+(dirtyCard?'':' disabled')+'>אישור</button>'+
    '</div></div>';
}

    .concat([...new Set(list.map(p=>p.section))].filter(s=>PACK_SECTIONS.indexOf(s)<0));
  if(!packSec) packSec = trip.settings.packSec || secs[0];

      '<button class="txt-btn" data-packgroupnew="1" style="font-size:13px">+ קטגוריה חדשה</button></div></div>';
  }
  const groups = [];
  inSec.forEach(p=>{ let g = groups.find(x=>x.name===p.group); if(!g){ g={name:p.group, items:[]}; groups.push(g); } g.items.push(p); });
  const done = list.filter(p=>p.done).length;
  const secBar = '<div class="days" style="margin-bottom:14px">'+secs.map(sc=>{
    const d = list.filter(p=>p.section===sc);
    return '<div class="day'+(sc===packSec?" on":"")+'" data-packsec="'+esc(sc)+'">'+esc(sc)+
      ' <span class="tiny num">'+d.filter(p=>p.done).length+'/'+d.length+'</span><div class="bar"></div></div>';
  }).join("")+'</div>';
  const head = '<div class="between">'+
      '<div style="font-size:17px;font-weight:600">רשימת ציוד</div>'+

  const body = groups.map(g=>{

    return '<div style="margin-bottom:'+(open?22:10)+'px">'+
      '<div class="between packhead" data-packgroup="'+esc(gkey)+'" style="margin-bottom:6px;cursor:pointer;align-items:center">'+
        '<div style="display:flex;align-items:center;gap:7px">'+
          '<svg class="gchev'+(open?" open":"")+'" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'+
          '<div style="font-size:13.5px;font-weight:600">'+esc(g.name)+'</div></div>'+
        '<div class="tiny num">'+gd+'/'+g.items.length+'</div></div>'+
      (!open ? '' :
      g.items.map(p=>
        '<div class="packrow" data-packid="'+p.id+'" style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line2)">'+
          '<span class="phandle" data-phandle="'+p.id+'">'+
            '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">'+

          '<span class="bdbox'+(p.done?" on":"")+'" data-check="'+p.id+'">'+(p.done?'✓':'')+'</span>'+
          '<input data-name="'+p.id+'" value="'+esc(p.name)+'" style="flex:1;min-width:0;font-size:14.5px;'+
            'background:transparent;border:0;padding:2px 0;'+(p.done?'color:var(--gray)':'')+'">'+
          '<span class="edit-item icon-only" data-packmove="'+p.id+'">'+
            '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+
              '<path d="M4 7h11"/><path d="M12 4l3 3-3 3"/><path d="M20 17H9"/><path d="M12 14l-3 3 3 3"/></svg></span>'+
          '<span class="edit-item del-item icon-only" data-del="packing:'+p.id+'">'+
            '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+
              '<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></span>'+
        '</div>').join("")+
      '<button class="txt-btn" data-packquick="'+esc(g.name)+'" style="font-size:12.5px;margin-top:10px">+ הוספה ל'+esc(g.name)+'</button>')+
    '</div>';
  }).join("");
  return '<div style="padding:2px 0 14px">'+head+'</div>'+
    '<div class="stickyhead">'+secBar+'</div>'+
    '<div class="frame">'+body+
      '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)">'+
      '<button class="txt-btn" data-packgroupnew="1" style="font-size:13px">+ קטגוריה חדשה</button></div></div>';
}

function backupHtml(){
  return '<div style="margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:20px;align-items:center;flex-wrap:wrap">'+
    '<span class="txt-btn" data-backup="export" style="font-size:12.5px">גיבוי לקובץ</span>'+
    '<span class="txt-btn" data-backup="import" style="font-size:12.5px">שחזור מקובץ</span>'+
    '<span class="tiny" id="backupNote"></span>'+
    '<input type="file" id="fileInput" accept="application/json,.json" style="display:none">'+
  '</div>';
}
function note(msg){
  const n = document.getElementById("backupNote"); if(!n) return;
  n.textContent = msg; setTimeout(()=>{ if(n.textContent===msg) n.textContent=""; }, 4000);
}
function exportBackup(){
  const data = JSON.stringify({app:"paris-trip", version:2, savedAt:new Date().toISOString(), trip}, null, 2);
  const url = URL.createObjectURL(new Blob([data],{type:"application/json"}));
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  const a = document.createElement("a");
  a.href = url; a.download = "paris-trip-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  note("הגיבוי הורד");
}
function importBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const parsed = JSON.parse(String(r.result));
      const t = parsed.trip || parsed;
      if(!t || (!Array.isArray(t.activities) && !Array.isArray(t.hotels) && !Array.isArray(t.transport))) throw 0;
      trip = normalize(t); selDate = defaultDate(); save(); render(); note("הנתונים שוחזרו");
    }catch(e){ note("הקובץ לא נקרא. צריך קובץ גיבוי מהאפליקציה."); }
  };
  r.readAsText(file);
}

  if(f.t==="area") return '<div class="field"><div class="tiny">'+f.l+'</div><textarea '+base+' rows="2">'+esc(v)+'</textarea></div>';
  if(f.t==="bigarea") return '<div class="field"><div class="tiny">'+f.l+'</div><textarea '+base+' rows="7" style="line-height:1.6">'+esc(v)+'</textarea></div>';

function collect(){
  const host = document.getElementById("draftForm") || sheetEl;
  host.querySelectorAll("[data-key]").forEach(n=>{ draft[n.dataset.key] = n.value; });
}
function saveDraft(){
  collect();
  const t = draftType;
  const num = v => v==="" || v==null ? "" : (parseFloat(String(v).replace(",","."))||0);
  if(t==="activity" && !String(draft.name||"").trim()) return;
  if(t==="hotel" && !String(draft.name||"").trim()) return;
  if(t==="expense" && !String(draft.description||"").trim()) return;
  ["lat","lng"].forEach(k=>{ if(k in draft) draft[k] = draft[k]===""?null:parseFloat(draft[k]); });
  if("price" in draft) draft.price = num(draft.price)||0;
  if("amount" in draft) draft.amount = num(draft.amount)||0;
  draft.currency = draft.currency || "EUR";
  if(t==="packing"){
    if(!String(draft.name||"").trim()) return;
    if(!draft.section) draft.section = sectionOf(draft.group);
    packSec = draft.section;
  }
  const listName = t==="activity"?"activities":(t==="hotel"?"hotels":(t==="transport"?"transport":(t==="packing"?"packing":"expenses")));
  const list = trip[listName];
  if(draftId){
    const i = list.findIndex(x=>x.id===draftId);
    if(i>=0) list[i] = Object.assign({}, list[i], draft);
  }else{
    draft.id = uid(t.slice(0,1));
    list.push(draft);
  }
  inlineOpen = null; inlineLinks = [];
  if(t==="activity" && draft.date) selDate = draft.date;
  if(t==="hotel" && draft.checkIn) selDate = selDate || draft.checkIn;
  closeSheet(); save(); render();
}
function findRec(type, id){
  const list = type==="activity"?trip.activities:(type==="hotel"?trip.hotels:(type==="transport"?trip.transport:(type==="packing"?trip.packing:trip.expenses)));
  return list.find(x=>x.id===id);
}

  const clamp=()=>{ s=Math.min(6,Math.max(1,s)); if(s===1){x=0;y=0;} else { const mx=im.offsetWidth*(s-1)/2, my=im.offsetHeight*(s-1)/2; x=Math.max(-mx,Math.min(mx,x)); y=Math.max(-my,Math.min(my,y)); } };
  window.__resetZoom=()=>{ s=1;x=0;y=0;pts.clear();apply(); };
  const snap=()=>{ const p=[...pts.values()]; if(p.length>=2){ const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); start={d, s, x, y, cx:(p[0].x+p[1].x)/2, cy:(p[0].y+p[1].y)/2}; } else if(p.length===1){ start={px:p[0].x, py:p[0].y, x, y}; } };
  im.addEventListener("pointerdown", e=>{ im.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false; snap(); });
  im.addEventListener("pointermove", e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const p=[...pts.values()];
    if(p.length>=2 && start && start.d){ const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); s=start.s*d/start.d; x=start.x+((p[0].x+p[1].x)/2-start.cx); y=start.y+((p[0].y+p[1].y)/2-start.cy); moved=true; clamp(); apply(); }
    else if(p.length===1 && start && s>1){ const dx=p[0].x-start.px, dy=p[0].y-start.py; if(Math.abs(dx)+Math.abs(dy)>3) moved=true; x=start.x+dx; y=start.y+dy; clamp(); apply(); } });
  const up=e=>{ pts.delete(e.pointerId); snap();
    if(!pts.size && !moved){ const now=Date.now(); if(now-lastTap<300){ s = s>1?1:2.5; if(s===1){x=0;y=0;} clamp(); apply(); lastTap=0; } else lastTap=now; } };
  im.addEventListener("pointerup", up); im.addEventListener("pointercancel", up);
  im.addEventListener("wheel", e=>{ e.preventDefault(); s*= e.deltaY<0?1.15:1/1.15; clamp(); apply(); }, {passive:false});
  im.addEventListener("click", e=>e.stopPropagation());
})();

(function(){
  const box = document.getElementById("docPages");
  box.style.touchAction = "pan-x pan-y";
  let d0=0, z0=1, mid=null;
  const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  box.addEventListener("touchstart", e=>{ if(e.touches.length===2){ d0=dist(e.touches); z0=docZoom;
    const r=box.getBoundingClientRect(); const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    mid={mx,my,cx:(box.scrollLeft+mx)/box.scrollWidth, cy:(box.scrollTop+my)/box.scrollHeight}; } }, {passive:true});
  box.addEventListener("touchmove", e=>{ if(e.touches.length!==2||!d0) return; e.preventDefault();
    docZoom = Math.max(1, Math.min(4, z0*dist(e.touches)/d0)); applyDocZoom();
    box.scrollLeft = mid.cx*box.scrollWidth - mid.mx; box.scrollTop = mid.cy*box.scrollHeight - mid.my; }, {passive:false});
  box.addEventListener("touchend", e=>{ if(e.touches.length<2) d0=0; });
  let lastTap=0;
  box.addEventListener("touchend", e=>{ if(e.touches.length||e.changedTouches.length!==1) return; const now=Date.now();
    if(now-lastTap<280){ docZoom = docZoom>1?1:2; applyDocZoom(); lastTap=0; } else lastTap=now; });
})();

function addFiles(fileList){
  const files = [...fileList];
  if(!files.length) return;
  let left = files.length;
  files.forEach(f=>{
    if(f.size > 4.5*1024*1024){ note("הקובץ "+f.name+" גדול מדי (מעל 4.5MB)"); if(--left===0) render(); return; }
    const r = new FileReader();
    r.onload = ()=>{
      trip.files = trip.files || [];
      trip.files.push({name:f.name, type:f.type, size:f.size, data:r.result, added:new Date().toISOString(), itemId:attachTarget||undefined});
      if(--left===0){ attachTarget = null; save(); render(); }
    };
    r.onerror = ()=>{ note("שגיאה בקריאת "+f.name); if(--left===0) render(); };
    r.readAsDataURL(f);
  });
}

    selItem = +t.dataset.item;
    if(hasMore(i.rec)) expanded[i.rec.id] = !expanded[i.rec.id];
    if(i.lat!=null && map){ map.setView([i.lat,i.lng], 15); const hit=markers.find(m=>m.idx===selItem); if(hit) hit.m.openPopup(); }
    const sy = window.pageYOffset;
    render();
    window.scrollTo(0, sy);
  }
});
function savePackName(node){
  const p = trip.packing.find(x=>x.id===node.dataset.name);
  if(!p) return;
  const v = node.value.trim();
  if(!v || v===p.name) { node.value = p.name; return; }
  p.name = v; save();
}
document.addEventListener("blur", e=>{
  if(e.target.dataset && e.target.dataset.name) savePackName(e.target);
}, true);
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.name){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener("input", e=>{
  if(e.target.dataset && e.target.dataset.cost){
    const box = e.target.closest(".estbox");
    const b = box && box.querySelector("[data-cok],[data-confirmcost],[data-expsave]");
    if(b) b.classList.add("hot");
  }
  if(e.target.dataset && e.target.dataset.inline && !dirtyCard){
    dirtyCard = true;
    const b = document.querySelector("[data-inlinesave]");
    if(b) b.removeAttribute("disabled");
  }
});
document.addEventListener("change", e=>{
  if(e.target.id==="fileInput" && e.target.files && e.target.files[0]){
    importBackup(e.target.files[0]); e.target.value="";
  }
});

/* הצגת פס הכותרת רק לאחר גלילה מעבר לכותרת הראשית */
(function(){
  const bar = document.getElementById("stickyBar");
  const head = document.querySelector("header");
  if(!bar || !head) return;
  const onScroll = ()=>{
    const past = head.getBoundingClientRect().bottom < 44;
    bar.classList.toggle("show", past);
  };
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();
})();

document.getElementById("filePick").addEventListener("change", e=>{ addFiles(e.target.files); e.target.value=""; });
document.addEventListener("dragover", e=>{
  if(tab!=="files") return; e.preventDefault();
  const z = document.getElementById("dropZone"); if(z) z.classList.add("hot");
});
document.addEventListener("dragleave", ()=>{ const z=document.getElementById("dropZone"); if(z) z.classList.remove("hot"); });
document.addEventListener("drop", e=>{
  if(tab!=="files") return; e.preventDefault();
  const z = document.getElementById("dropZone"); if(z) z.classList.remove("hot");
  if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ openDrawer(false); closeDoc(); } });
/* ---------- מסך פתיחה ---------- */
(function(){
  const w = document.getElementById("welcome");
  if(!w) return;
  w.style.backgroundImage = 'url("pasted-1790009733245-0.png")';
  const hide = ()=>{ w.classList.add("off"); setTimeout(()=>w.remove(), 800); };
  w.addEventListener("click", hide);
  setTimeout(hide, 2800);
})();
/* ---------- גרירה ברשימת הציוד ---------- */
(function(){
  let src = null, rows = [];
  document.addEventListener("pointerdown", e=>{
    const h = e.target.closest("[data-phandle]");
    if(!h) return;
    e.preventDefault();
    src = h.dataset.phandle;
    rows = [...document.querySelectorAll(".packrow")];
    const row = h.closest(".packrow");
    if(row) row.classList.add("pdragging");
    try{ h.setPointerCapture(e.pointerId); }catch(err){}
  });
  document.addEventListener("pointermove", e=>{
    if(!src) return;
    const y = e.clientY;
    rows.forEach(r=>{
      const b = r.getBoundingClientRect();
      r.classList.toggle("pover", r.dataset.packid !== src && y >= b.top && y <= b.bottom);
    });
  });
  document.addEventListener("pointerup", e=>{
    if(!src) return;
    const y = e.clientY;
    let targetId = null;
    for(const r of rows){
      const b = r.getBoundingClientRect();
      if(y >= b.top && y <= b.bottom){ targetId = r.dataset.packid; break; }
    }
    const from = trip.packing.findIndex(p=>p.id===src);
    if(targetId && targetId !== src && from >= 0){
      const item = trip.packing.splice(from,1)[0];
      const to = trip.packing.findIndex(p=>p.id===targetId);
      item.group = (trip.packing[to]||item).group;
      item.section = (trip.packing[to]||item).section;
      trip.packing.splice(to,0,item);
      save();
    }
    rows.forEach(r=>r.classList.remove("pover"));
    src = null;
    render();
  });
})();

/* ---------- החלקה בין ימים ---------- */
(function(){
  let x0=null, y0=null, act=false;
  const view = ()=>document.getElementById("view");
  document.addEventListener("touchstart", e=>{
    if(tab!=="itinerary" || e.touches.length!==1) { act=false; return; }
    if(e.target.closest("#map,.mapwrap,.days,input,textarea,select,.formcard,[data-phandle]")) { act=false; return; }
    const v = view();
    if(!v || !v.contains(e.target)) { act=false; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; act = true;
  }, {passive:true});
  document.addEventListener("touchend", e=>{
    if(!act || x0===null) return;
    act = false;
    const tch = e.changedTouches[0];
    const dx = tch.clientX - x0, dy = tch.clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx)*0.7) return;
    const ds = allDates();
    const i = ds.indexOf(selDate);
    if(i < 0) return;
    const next = dx < 0 ? i+1 : i-1;
    if(next < 0 || next >= ds.length) return;
    selDate = ds[next]; selItem = null; inlineOpen = null;
    render();
    const days = document.querySelector(".days"), on = document.querySelector(".day.on");
    if(days && on) days.scrollLeft = on.offsetLeft - (days.clientWidth - on.offsetWidth)/2;
  }, {passive:true});
})();
applyTheme();
render();
cloudPull();
</script>
